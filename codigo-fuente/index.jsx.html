function PatRecipes({recipes}){const [sel,setSel]=useState(null);const [srv,setSrv]=useState(0);const [sr,setSr]=useState('');const flt=recipes.filter(r=>r.name.toLowerCase().includes(sr.toLowerCase()));if(sel)return <div className="anim"><Hdr title={sel.name} onBack={()=>setSel(null)}/><div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}><span style={{padding:'8px 14px',background:BD,borderRadius:12,fontSize:13,color:TS}}>⏱ {sel.time}</span><span style={{padding:'8px 14px',background:BD,borderRadius:12,fontSize:13,color:TS}}>{sel.cal} kcal</span></div><Cd style={{marginBottom:16}}>{sel.servings>0&&(sel.ingredients||[]).some(x=>/^\s*(\d|½|¼|¾)/.test(typeof x==='string'?x:''))&&<div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><span style={{fontSize:14,fontWeight:600,color:TS}}>Raciones</span><div style={{display:'flex',background:'rgba(118,118,128,.12)',borderRadius:9,padding:2,flex:1}}>{[1,2,4,6].map(n=><button key={n} onClick={()=>setSrv(n)} style={{flex:1,padding:'6px 0',border:'none',borderRadius:7,fontSize:14,fontWeight:600,fontFamily:'inherit',background:(srv||sel.servings)===n?'#fff':'transparent',boxShadow:(srv||sel.servings)===n?'0 1px 3px rgba(0,0,0,.12)':'none',color:TX,cursor:'pointer'}}>{n}</button>)}</div></div>}<h3 style={{fontSize:16,fontWeight:700,color:P,marginBottom:12}}>Ingredientes</h3>{(sel.ingredients||[]).map(x=>scaleIng(x,(srv||sel.servings)/(sel.servings||1))).map((x,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',borderBottom:i<sel.ingredients.length-1?'1px solid '+BD:'none'}}><div style={{width:6,height:6,borderRadius:'50%',background:O}}/><span style={{fontSize:14,color:TS}}>{x}</span></div>)}</Cd>{sel.steps&&sel.steps.length>0&&<Cd><h3 style={{fontSize:16,fontWeight:700,color:P,marginBottom:14}}>Preparación</h3>{sel.steps.map((s,i)=><div key={i} style={{display:'flex',gap:14,marginBottom:i<sel.steps.length-1?16:0}}><div style={{width:32,height:32,borderRadius:10,background:OS,color:OD,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:700,flexShrink:0}}>{i+1}</div><p style={{fontSize:14,color:TS,lineHeight:1.5,paddingTop:5}}>{s}</p></div>)}</Cd>}</div>;return <div className="anim"><Hdr title="Recetas"/><input placeholder="Buscar receta..." value={sr} onChange={e=>setSr(e.target.value)} style={{width:'100%',padding:'12px 14px',border:'1px solid '+BK,borderRadius:16,fontSize:14,fontFamily:'inherit',background:'#fff',marginBottom:16}}/><div style={{display:'flex',flexDirection:'column',gap:12}}>{flt.map(r=><Cd key={r.id} onClick={()=>setSel(r)} style={{padding:16}}><h3 style={{fontSize:15,fontWeight:700,marginBottom:8}}>{r.name}</h3><div style={{display:'flex',gap:12}}><span style={{fontSize:12,color:TS}}>⏱ {r.time}</span><span style={{fontSize:12,color:TS}}>{r.cal} kcal</span></div></Cd>)}</div></div>}

function PatMore({patient,onUpdate}){if(!patient)return null;const [pw,setPw]=useState('');const [pwCur,setPwCur]=useState('');const [msg,setMsg]=useState('');const [delMode,setDelMode]=useState(false);const [delPw,setDelPw]=useState('');const [delMsg,setDelMsg]=useState('');async function doExport(){const d=await DB.exportMyData();if(d)downloadJSON(d,'mis-datos.json');else await nAlert('Disponible al conectar con el servidor.')}async function doDelete(){if(!delPw){setDelMsg('Escribe tu contraseña');return}if(!await nConfirm('Dejarás de tener acceso a la app.',{title:'¿Quieres darte de baja?',ok:'Darme de baja',danger:true}))return;const r=await DB.deleteMyAccount(delPw);if(r&&r.ok){try{localStorage.removeItem('nusal_auth')}catch(e){}setToken('');await nAlert('Te has dado de baja. Tu historia clínica queda bloqueada y se conservará el plazo legal.');if(_appLogout)_appLogout();else window.location.reload()}else setDelMsg((r&&r.error)||'No se pudo eliminar')}async function chPw(){if(!pw||pw.length<8){setMsg('La nueva debe tener mínimo 8 caracteres');return}if(DB.ready&&!pwCur){setMsg('Escribe tu contraseña actual');return}if(DB.ready){const r=await DB.changePassword(pwCur,pw);if(!r.ok){setMsg(r.error||'No se pudo cambiar');return}}onUpdate(patient.id,{pw});setMsg('✓ Contraseña actualizada');setPw('');setPwCur('')}function hPhoto(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{const f=e.target.files[0];if(f){safeImage(f,512,'image/jpeg').then(u=>onUpdate(patient.id,{photo:u})).catch(er=>nAlert(er.message))}};inp.click()}return <div className="anim"><Hdr title="Mi Perfil"/><div className="pc-cols"><Cd style={{marginBottom:16,padding:16}}><div style={{display:'flex',alignItems:'center',gap:14}}><div style={{position:'relative',cursor:'pointer'}} onClick={hPhoto}><PP name={patient.nm} photo={patient.photo} size={60}/><div style={{position:'absolute',bottom:-2,right:-2,width:22,height:22,borderRadius:'50%',background:O,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon n="camera" size={12} color='#fff'/></div></div><div><p style={{fontWeight:700,fontSize:16}}>{patient.nm}</p><p style={{fontSize:12,color:TS}}>{patient.email}</p></div></div></Cd><div style={{marginBottom:16}}><NotifButton label="Avisos de tu nutricionista"/></div><Cd style={{marginBottom:16,padding:16}}><p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:TM,marginBottom:10}}>Mi supermercado</p><p style={{fontSize:12,color:TS,marginBottom:10}}>Tu cesta mostrará los productos de la cadena que elijas.</p><div className="noscroll" style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:2}}>{[{k:'',l:'Genérico'},...STORES.map(s=>({k:s,l:s}))].map(s=><button key={s.k} onClick={()=>{onUpdate(patient.id,{preferredStore:s.k});DB.setPreferredStore(s.k);}} className="press" style={{flex:'0 0 auto',padding:'8px 14px',borderRadius:12,border:'1px solid '+((patient.preferredStore||'')===s.k?P:BK),background:(patient.preferredStore||'')===s.k?PS:'#fff',color:(patient.preferredStore||'')===s.k?P:TS,fontSize:13,fontWeight:(patient.preferredStore||'')===s.k?700:500,whiteSpace:'nowrap'}}>{s.l}</button>)}</div></Cd><Cd style={{marginBottom:16,padding:16}}><p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:TM,marginBottom:10}}>Cambiar contraseña</p><PwInput value={pwCur} onChange={setPwCur} placeholder="Contraseña actual" style={{width:'100%',padding:'10px 14px',fontSize:14,fontFamily:'inherit',marginBottom:8}}/><div style={{display:'flex',gap:8}}><PwInput value={pw} onChange={setPw} placeholder="Nueva contraseña" style={{flex:1,padding:'10px 14px',fontSize:14,fontFamily:'inherit'}}/><Btn onClick={chPw} small><Icon n="key" size={16}/></Btn></div>{msg&&<p style={{fontSize:12,color:GN,marginTop:6}}>{msg}</p>}</Cd><Cd style={{marginBottom:16,padding:16}}><p style={{fontSize:12,fontWeight:700,textTransform:'uppercase',color:TM,marginBottom:8}}>Mis datos (RGPD)</p><p style={{fontSize:12,color:TS,lineHeight:1.5,marginBottom:12}}>Puedes descargar una copia completa de tus datos o darte de baja de la app.</p><Btn onClick={doExport} full color={PS}><span style={{color:P,display:'flex',alignItems:'center',gap:8}}><Icon n="download" size={16}/>Descargar mis datos</span></Btn><div style={{height:8}}/>{!delMode?<button onClick={()=>setDelMode(true)} className="press" style={{width:'100%',background:RSS,color:RS,border:'none',borderRadius:14,padding:'12px',fontSize:13,fontWeight:700}}>Darme de baja</button>:<div style={{padding:12,background:RSS,borderRadius:14}}><p style={{fontSize:12,color:'#9F1239',fontWeight:700,marginBottom:8,lineHeight:1.4}}>⚠️ Dejarás de poder entrar en la app. Por obligación legal, tu historia clínica se conservará bloqueada 5 años y después se eliminará automáticamente.</p><PwInput value={delPw} onChange={setDelPw} placeholder="Tu contraseña" style={{width:'100%',padding:'10px 12px',fontSize:13,fontFamily:'inherit',marginBottom:8}}/>{delMsg&&<p style={{fontSize:12,color:'#9F1239',marginBottom:8,fontWeight:600}}>{delMsg}</p>}<div style={{display:'flex',gap:8}}><button onClick={()=>{setDelMode(false);setDelPw('');setDelMsg('')}} className="press" style={{flex:1,background:'#fff',border:'none',borderRadius:12,padding:'10px',fontSize:13,fontWeight:700}}>Cancelar</button><button onClick={doDelete} className="press" style={{flex:1,background:RS,color:'#fff',border:'none',borderRadius:12,padding:'10px',fontSize:13,fontWeight:700}}>Eliminar</button></div></div>}</Cd>{CLINIC.whatsapp&&<button onClick={()=>window.open('https://wa.me/'+String(CLINIC.whatsapp).replace(/\D/g,''),'_blank','noopener,noreferrer')} className="press" style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:10,background:'#25D366',color:'#fff',border:'none',borderRadius:14,padding:'14px',fontSize:16,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}><Icon n="chat" size={18} color='#fff'/>WhatsApp de la clínica</button>}<LegalLinks/><button onClick={doLogout} className="press" style={{width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8,background:'#fff',color:RS,border:'1.5px solid '+RSB,borderRadius:18,padding:'13px',fontSize:14,fontWeight:700,marginTop:12,fontFamily:'inherit'}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Cerrar sesión</button></div></div>}

// ═══ LOGIN ═══
function LoginScreen({onLogin,patients,pc}){
  const [email,setEmail]=useState('');const [pw,setPw]=useState('');const [err,setErr]=useState('');const [ld,setLd]=useState(false);
  const [step,setStep]=useState('login');const [code,setCode]=useState('');const [npw,setNpw]=useState('');const [okMsg,setOkMsg]=useState('');
  useEffect(()=>{try{const s=localStorage.getItem('nusal_auth');if(s){const d=JSON.parse(s);setEmail(d.e||'')}}catch(e){}},[]);

  function finish(role,name,pid,consent){try{localStorage.setItem('nusal_auth',JSON.stringify({e:email.toLowerCase().trim()}))}catch(ex){}onLogin(role,name,pid,{consentAccepted:consent});}

  async function go(e){e.preventDefault();setErr('');const k=email.toLowerCase().trim();setLd(true);
    // 1) login real contra el backend (con posible reto 2FA)
    const u=await DB.login(k,pw,step==='2fa'?code:undefined);
    if(u&&u.needs2FA){setStep('2fa');setLd(false);if(u.error)setErr(u.error);return}
    if(u&&u.role){finish(u.role,u.fullName,u.patientId,u.consentAccepted!==false);return}
    // En producción nunca se entra en modo demo
    if(IS_PROD){setLd(false);setErr(u&&u.netError?(/TU-BACKEND/i.test(API_URL)?'Falta indicar la dirección del servidor: edita «apiUrl» en config.js y vuelve a publicar.':'No se puede conectar con el servidor. Comprueba tu conexión e inténtalo de nuevo.'):(u&&u.error)||'Correo o contraseña incorrectos');return}
    // 2) fallback demo (sin backend)
    if(k===ADMIN_EMAIL&&pw===ADMIN_PW){setTimeout(()=>finish('admin',ADMIN_NAME,null,true),300);return}
    if(k===MEDICO_EMAIL&&pw===MEDICO_PW){setTimeout(()=>finish('medico',MEDICO_NAME,null,true),300);return}
    const found=patients.find(p=>p.email===k&&p.pw===pw);
    if(found){const consent=(()=>{try{return localStorage.getItem('nusal_consent_'+found.id)==='1'}catch(e){return false}})();setTimeout(()=>finish('patient',found.nm,found.id,consent),300);return}
    setLd(false);setErr('Correo o contraseña incorrectos')}

  const inSt={width:'100%',padding:'13px 14px',border:'1px solid '+BK,borderRadius:16,fontSize:14,fontFamily:'inherit',background:'#fff'};
  return <div style={{minHeight:'100vh',display:'flex',background:BG}}>{pc&&<LoginHero/>}<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:pc?48:24}}><div className="anim" style={{width:'100%',maxWidth:pc?420:380}}><input type="text" name="website" tabIndex={-1} autoComplete="off" aria-hidden="true" onChange={e=>{_hp=e.target.value}} style={{position:'absolute',left:-9999,width:1,height:1,opacity:0}}/>
    {pc?<div style={{marginBottom:30}}><p style={{fontFamily:"var(--round)",fontSize:32,fontWeight:800,color:TX,lineHeight:1.1}}>Bienvenido/a</p><p style={{fontSize:14,color:TS,marginTop:6}}>Accede con tu correo y contraseña</p></div>:<div style={{display:'flex',justifyContent:'center',marginBottom:28}}><NLogo size={150}/></div>}
    {step==='login'?<>
    {!pc&&<p style={{fontSize:15,color:TS,textAlign:'center',marginBottom:32}}>Tu espacio de salud y bienestar</p>}
    <form onSubmit={go} autoComplete="on">
      <div style={{marginBottom:18}}><label style={{fontSize:13,fontWeight:600,color:P,display:'block',marginBottom:6}}>Correo</label><input type="email" name="email" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" required style={inSt}/></div>
      <div style={{marginBottom:18}}><label style={{fontSize:13,fontWeight:600,color:P,display:'block',marginBottom:6}}>Contraseña</label><PwInput name="password" autoComplete="current-password" value={pw} onChange={setPw} placeholder="••••••••" style={inSt}/></div>
      {err&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'10px 14px',background:RSS,border:'1px solid '+RSB,borderRadius:12,marginBottom:16}}><span style={{color:'#9F1239',fontSize:13}}>{err}</span></div>}
      <Btn onClick={go} full disabled={ld}>{ld?'Accediendo...':'Entrar'}</Btn>
    </form>
    {okMsg&&<p style={{fontSize:12.5,color:GN,textAlign:'center',marginTop:12,fontWeight:600}}>{okMsg}</p>}
    <button onClick={()=>{setStep('forgot');setErr('');setOkMsg('')}} className="press" style={{width:'100%',background:'none',border:'none',color:P,fontSize:13,marginTop:14,fontWeight:600,cursor:'pointer'}}>¿Has olvidado tu contraseña?</button>
    <LegalLinks/>
    {!DB.ready&&!IS_PROD&&ADMIN_PW&&<div style={{marginTop:28,background:PS,border:'1px solid '+PB,borderRadius:16,padding:14}}><p style={{fontSize:11,fontWeight:700,color:P,marginBottom:8,textTransform:'uppercase',letterSpacing:1}}>Demo</p><p style={{fontSize:12,color:TS,lineHeight:1.9}}><b style={{color:P}}>Admin:</b> {ADMIN_EMAIL} / {ADMIN_PW}</p><p style={{fontSize:12,color:TS,lineHeight:1.9}}><b style={{color:P}}>Médico:</b> {MEDICO_EMAIL} / {MEDICO_PW}</p>{DEMO_PATIENTS[0]&&<p style={{fontSize:12,color:TS,lineHeight:1.9}}><b style={{color:P}}>Paciente:</b> {DEMO_PATIENTS[0].email} / {DEMO_PATIENTS[0].pw}</p>}</div>}
    </>:step==='2fa'?<>
    <p style={{fontSize:15,fontWeight:600,color:P,textAlign:'center',marginBottom:6}}>Verificación en dos pasos</p>
    <p style={{fontSize:13,color:TS,textAlign:'center',marginBottom:24}}>Introduce el código de tu app de autenticación</p>
    <form onSubmit={go}><input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,''))} placeholder="000000" inputMode="numeric" maxLength={6} style={{...inSt,textAlign:'center',fontSize:24,letterSpacing:8,fontWeight:700}}/>
    {err&&<div style={{padding:'10px 14px',background:RSS,border:'1px solid '+RSB,borderRadius:12,margin:'14px 0'}}><span style={{color:'#9F1239',fontSize:13}}>{err}</span></div>}
    <div style={{height:16}}/><Btn onClick={go} full disabled={ld||code.length<6}>{ld?'Verificando...':'Verificar'}</Btn></form>
    <button onClick={()=>{setStep('login');setCode('');setErr('')}} className="press" style={{width:'100%',background:'none',border:'none',color:TS,fontSize:13,marginTop:14,cursor:'pointer'}}>← Volver</button>
    </>:step==='forgot'?<>
    <p style={{fontSize:15,fontWeight:600,color:P,textAlign:'center',marginBottom:6}}>Recuperar contraseña</p>
    <p style={{fontSize:13,color:TS,textAlign:'center',marginBottom:24}}>Te enviaremos un código de 6 dígitos a tu email</p>
    <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" style={inSt}/>
    {err&&<div style={{padding:'10px 14px',background:RSS,border:'1px solid '+RSB,borderRadius:12,margin:'14px 0'}}><span style={{color:'#9F1239',fontSize:13}}>{err}</span></div>}
    <div style={{height:16}}/><Btn onClick={async()=>{if(!email){setErr('Escribe tu email');return}setLd(true);setErr('');const r=await DB.forgotPassword(email.toLowerCase().trim());setLd(false);if(r.ok)setStep('reset');else setErr(r.error)}} full disabled={ld}>{ld?'Enviando...':'Enviar código'}</Btn>
    <button onClick={()=>{setStep('login');setErr('')}} className="press" style={{width:'100%',background:'none',border:'none',color:TS,fontSize:13,marginTop:14,cursor:'pointer'}}>← Volver</button>
    </>:<>
    <p style={{fontSize:15,fontWeight:600,color:P,textAlign:'center',marginBottom:6}}>Introduce el código</p>
    <p style={{fontSize:13,color:TS,textAlign:'center',marginBottom:24}}>Lo hemos enviado a {email}. Caduca en 15 min.</p>
    <input value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,''))} placeholder="000000" inputMode="numeric" maxLength={6} style={{...inSt,textAlign:'center',fontSize:24,letterSpacing:8,fontWeight:700}}/>
    <div style={{height:12}}/>
    <PwInput value={npw} onChange={setNpw} placeholder="Nueva contraseña (mín. 6)" style={inSt}/>
    {err&&<div style={{padding:'10px 14px',background:RSS,border:'1px solid '+RSB,borderRadius:12,margin:'14px 0'}}><span style={{color:'#9F1239',fontSize:13}}>{err}</span></div>}
    <div style={{height:16}}/><Btn onClick={async()=>{if(code.length<6||npw.length<8){setErr('Código de 6 dígitos y contraseña de mínimo 8 caracteres');return}setLd(true);setErr('');const r=await DB.resetPassword(email.toLowerCase().trim(),code,npw);setLd(false);if(r.ok){setStep('login');setCode('');setNpw('');setPw('');setOkMsg('✓ Contraseña cambiada. Ya puedes entrar.')}else setErr(r.error)}} full disabled={ld}>{ld?'Guardando...':'Cambiar contraseña'}</Btn>
    <button onClick={()=>{setStep('forgot');setErr('')}} className="press" style={{width:'100%',background:'none',border:'none',color:TS,fontSize:13,marginTop:14,cursor:'pointer'}}>← Volver</button>
    </>}
  </div></div></div>;
}

// y la convierte en semanas → días → comidas. Nunca inventa calorías: si el documento no las trae, quedan vacías.
const IMPORT_LIBS={

function nrm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9%\s]/g,' ').replace(/\s+/g,' ').trim()}

// ── Días ──

// ── Comidas ── ("almuerzo" es media mañana si el documento también usa "comida")

// Separa "Desayuno (8:00): tostada..." → {label, rest}
function splitLabel(line){
  const l=line.replace(/^[\s•\-\*·–—>►▪◦]+/,'').trim();
  const m=l.match(/^([A-Za-zÁÉÍÓÚÜÑáéíóúüñ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]{0,24}?\s*(?:\d{1,2})?)\s*(?:\([^)]{0,20}\))?\s*[:\-–—|]\s*(.+)$/);

// ── Contexto: banco de comidas y alimentos para reconocer platos e ingredientes ──
const FOOD_STOP=new Set(['de','del','la','el','los','las','con','sin','al','a','en','y','extra','natural','entero','entera','blanco','blanca','integral','fresco','fresca','magro','magra','cocido','cocida','crudo','cruda','virgen','desnatado','desnatada','semidesnatado','semidesnatada','light','tipo','seco','seca','hervido','hervida','plancha','polvo','zumo','sal','negro','negra','rojo','roja','verde','verdes','dulce','agua','puro','pura','casero','casera','bajo','baja','grasa']);
function makeImportCtx(mealBank,alimentos){
  const bankIdx={};(mealBank||[]).forEach(m=>{if(m&&m.name)bankIdx[nrm(m.name)]=m});
  const kw=[];const full=[];
  (alimentos||[]).forEach(a=>{const nm=a.nombre||a.name;if(!nm)return;const n=nrm(nm);full.push([n,nm]);n.split(' ').forEach(w=>{if(w.length>=4&&!FOOD_STOP.has(w))kw.push([w,nm])})});
  return {bankIdx,kw,full,almuerzoMid:false};
}
function detectIngredients(text,ctx){
  const n=' '+nrm(text)+' ';const out=[];const used=new Set();
  const has=w=>new RegExp('\\b'+w.replace(/\s+/g,'\\s+')+'(s|es)?\\b').test(n);
  ctx.full.forEach(([k,nm])=>{if(out.length<10&&!out.includes(nm)&&has(k)){out.push(nm);k.split(' ').forEach(w=>used.add(w))}});
  ctx.kw.forEach(([w,nm])=>{if(out.length<10&&!used.has(w)&&!out.includes(nm)&&has(w)){out.push(nm);used.add(w)}});
  if(out.length)return out;

  return String(text).split(/,|;|\+|\/| y | con | e /i).map(p=>p.replace(/^\s*\d+([.,]\d+)?\s*(g|gr|grs|gramos|ml|kg|l|ud|uds|unidad(es)?|cucharadas?|cdas?|vasos?|tazas?|piezas?|rebanadas?|lonchas?|puñados?|raciones?)?\.?\s*(de\s+)?/i,'').replace(/\(.*?\)/g,'').trim()).filter(p=>p.length>=3&&p.length<=40&&!/\d{2,}\s*kcal/i.test(p)).slice(0,6).map(p=>p.charAt(0).toUpperCase()+p.slice(1));
}
function parseMealCell(t,ctx){

  let s='';ls.forEach((l,i)=>{if(!i){s=l;return}s+=(/^[a-záéíóúñü0-9(+]/.test(l)||/^k?cal\b/i.test(l)?' ':', ')+l});

  if(m){const v=parseInt(m[1]);if(v>0&&v<3000)cal=v;s=s.replace(m[0],' ')}

// ── Acumulación en bruto ──
function rawWeek(){const w={};WEEK_DAYS.forEach(d=>w[d]={});return w}
function addRaw(w,d,m,t){t=String(t||'').trim();if(!t)return;w[d][m]=w[d][m]?w[d][m]+'\n'+t:t}

function detectAlmuerzoMid(cells){let a=false,c=false;cells.forEach(x=>{const n=nrm(x);if(/^almuerzo\b/.test(n))a=true;if(/^comida\b/.test(n))c=true});return a&&c}

// ── Tablas (Excel, CSV, Word, PDF reconstruido) ──
function cleanRows(rows){return (rows||[]).map(r=>(r||[]).map(c=>String(c==null?'':c).replace(/\u00a0/g,' ').trim())).filter(r=>r.some(c=>c))}
function parseDietRows(rowsIn,ctx){
  const rows=cleanRows(rowsIn);if(!rows.length)return null;
  ctx.almuerzoMid=detectAlmuerzoMid(rows.flat());
  const res=gridDaysAsColumns(rows,ctx)||gridMealsAsColumns(rows,ctx)||gridLongFormat(rows,ctx);
  if(res&&!res.title){const cand=rows.slice(0,6).filter(r=>r.filter(c=>c).length===1).map(r=>r.find(c=>c));
    const t=cand.find(c=>/dieta/i.test(c))||cand.find(c=>/plan|men[uú]/i.test(c)&&!weekLabel(c));
    if(t)res.title=t.replace(/\s*[—–-]\s*semana\s*\d+\s*$/i,'').trim()}

// A) Tabla semanal clásica: una fila de cabecera con los días y la comida en la primera columna
function gridDaysAsColumns(rows,ctx){
  const weeks=[];let cur=null,colDay=null,labelCol=-1,last=null,forceNew=false,seq=0;
  for(const r of rows){
    const dayCells=[];r.forEach((c,i)=>{const d=matchDay(c);if(d)dayCells.push([i,d.d])});
    if(dayCells.length>=3){colDay={};dayCells.forEach(([i,d])=>colDay[i]=d);const first=Math.min(...dayCells.map(x=>x[0]));labelCol=first>0?0:-1;
      if(!cur||rawHas(cur)||forceNew){cur=rawWeek();weeks.push(cur)}forceNew=false;last=null;seq=0;continue}
    const nonEmpty=r.filter(c=>c);
    if(nonEmpty.length<=2&&nonEmpty.some(c=>weekLabel(c))){if(cur&&rawHas(cur))forceNew=true;continue}
    if(!colDay)continue;
    if(forceNew){cur=rawWeek();weeks.push(cur);forceNew=false}
    const lab=labelCol>=0?r[labelCol]:'';
    let meal=matchMeal(lab,ctx.almuerzoMid);
    if(labelCol>=0){
      if(meal)last=meal;
      else if(lab){if(HEADING_RX.test(nrm(lab))||nrm(lab).length>2){last=null}continue}
      if(!last)continue;
      Object.keys(colDay).forEach(ci=>addRaw(cur,colDay[ci],last,r[ci]));
    }else{
      // Sin columna de etiquetas: la comida puede venir dentro de la celda ("Desayuno: ...") o por orden de filas
      const inCell=Object.keys(colDay).map(ci=>{const sl=splitLabel(r[ci]||'');return matchMeal(sl.label,ctx.almuerzoMid)}).find(Boolean);
      const mealSeq=inCell||MEAL_TYPES[Math.min(seq,MEAL_TYPES.length-1)];seq++;
      Object.keys(colDay).forEach(ci=>{const sl=splitLabel(r[ci]||'');addRaw(cur,colDay[ci],matchMeal(sl.label,ctx.almuerzoMid)?matchMeal(sl.label,ctx.almuerzoMid):mealSeq,matchMeal(sl.label,ctx.almuerzoMid)?sl.rest:r[ci])});
    }
  }
  const ok=weeks.filter(rawHas);return ok.length?{raw:ok,format:'Tabla semanal (días en columnas)'}:null;
}
// B) Días en filas y comidas en columnas
function gridMealsAsColumns(rows,ctx){
  const weeks=[];let cur=null,colMeal=null,lastDay=null,forceNew=false;
  for(const r of rows){
    const mc=[];r.forEach((c,i)=>{const m=matchMeal(c,ctx.almuerzoMid);if(m)mc.push([i,m])});
    if(mc.length>=3){colMeal={};mc.forEach(([i,m])=>colMeal[i]=m);if(!cur||rawHas(cur)||forceNew){cur=rawWeek();weeks.push(cur)}forceNew=false;lastDay=null;continue}
    const nonEmpty=r.filter(c=>c);
    if(nonEmpty.length<=2&&nonEmpty.some(c=>weekLabel(c))){if(cur&&rawHas(cur))forceNew=true;continue}
    if(!colMeal)continue;
    if(forceNew){cur=rawWeek();weeks.push(cur);forceNew=false}
    const dIdx=r.findIndex(c=>matchDay(c));
    if(dIdx>=0){const dd=matchDay(r[dIdx]);lastDay=dd.d}
    else if(r[0])continue;
    if(!lastDay)continue;
    Object.keys(colMeal).forEach(ci=>{if(Number(ci)!==dIdx)addRaw(cur,lastDay,colMeal[ci],r[ci])});
  }

}
// C) Formato largo: una fila por comida (Día | Comida | Plato | kcal)
function gridLongFormat(rows,ctx){

  const cD=find(/^(dia|day|fecha)\b/),cM=find(/^(comida|momento|toma|ingesta|tipo|meal)\b/),cP=find(/^(plato|menu|descripcion|alimentos|receta|contenido|dish|detalle)/),cK=find(/(kcal|calorias|energia)/),cW=find(/^semana|week/);
  if(cD>=0&&cM>=0&&cP>=0)hdr={cD,cM,cP,cK,cW};
  const body=hdr?rows.slice(1):rows;
  for(const r of body){
    let d,m,dish,cal='',wk=-1;
    if(hdr){d=matchDay(r[hdr.cD]);m=matchMeal(r[hdr.cM],ctx.almuerzoMid);dish=r[hdr.cP];if(hdr.cK>=0)cal=r[hdr.cK];if(hdr.cW>=0)wk=(parseInt(String(r[hdr.cW]).replace(/\D/g,''))||1)-1}

      const rest=r.filter((c,i)=>i!==di&&i!==mi&&c);const num=rest.find(c=>/^\d{2,4}(\s*kcal)?$/i.test(c));dish=rest.filter(c=>c!==num).join(', ');cal=num||''}
    if(!d||!m||!dish)continue;
    if(wk<0)wk=d.w>=0?d.w:0;
    while(weeks.length<=wk)weeks.push(rawWeek());

}

// ── Texto libre (PDF sin tabla, Word, texto pegado) ──
function parseDietText(text,ctx){
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  ctx.almuerzoMid=detectAlmuerzoMid(lines.map(l=>splitLabel(l).label||l));
  const weeks=[rawWeek()];let w=0,day=null,meal=null,sawDay=false,title='';const all={};
  const put=(m,t)=>{if(!t)return;if(day)addRaw(weeks[w],day,m,t);else all[m]=all[m]?all[m]+'\n'+t:t};
  for(const raw of lines){
    let line=raw;
    const wl=weekLabel(line);
    if(wl&&line.length<40){w=wl-1;while(weeks.length<=w)weeks.push(rawWeek());day=null;meal=null;continue}
    if(!title&&/dieta|plan|menu/i.test(line)&&line.length<90&&!matchMeal(splitLabel(line).label,ctx.almuerzoMid))title=line;
    let sl=splitLabel(line);
    let dd=matchDay(sl.label)||(!sl.label?matchDay(line):null);
    if(!dd){const first=line.split(/\s+/)[0];const d2=matchDay(first);if(d2&&nrm(first).length>=5&&line.length<60){dd=d2;sl={label:first,rest:line.slice(first.length).replace(/^[\s:\-–—]+/,'')}}}
    if(dd){day=dd.d;sawDay=true;if(dd.w>=0){w=dd.w;while(weeks.length<=w)weeks.push(rawWeek())}
      line=sl.label?sl.rest:'';if(!line){meal=null;continue}sl=splitLabel(line)}
    let mm=matchMeal(sl.label,ctx.almuerzoMid);
    if(!mm&&!sl.label&&line.length<=32)mm=matchMeal(line,ctx.almuerzoMid),mm&&(sl={label:line,rest:''});
    if(mm){meal=mm;line=sl.rest;if(!line)continue}
    else if(sl.label&&HEADING_RX.test(nrm(sl.label))){meal=null;continue}
    else if(!sl.label&&HEADING_RX.test(nrm(line))){meal=null;continue}
    else if(line===line.toUpperCase()&&/[A-ZÁÉÍÓÚ]{4}/.test(line)&&line.length<40&&!mm){meal=null;continue}
    if(meal)put(meal,line);
  }
  const notes=[];
  if(!sawDay&&Object.keys(all).length){WEEK_DAYS.forEach(d=>Object.keys(all).forEach(m=>addRaw(weeks[0],d,m,all[m])));notes.push('El documento no indica días: se ha aplicado el mismo menú a toda la semana.')}
  const ok=weeks.filter(rawHas);
  return ok.length?{raw:ok,format:'Texto (días y comidas por apartados)',title,notes}:null;
}

// ── Lectores por formato ──
function parseCSV(text){
  const head=text.split(/\r?\n/).slice(0,12).join('\n');let dl=',',best=-1;
  [';','\t',','].forEach(c=>{const n=head.split(c).length-1;if(n>best){best=n;dl=c}});
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}
  row.push(cell);rows.push(row);return rows;
}
async function readPdf(file){

  const rows=[];let text='';
  for(let p=1;p<=Math.min(pdf.numPages,40);p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({s:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0,h:Math.abs(it.transform[3])||10}));

    lines.sort((a,b)=>b.y-a.y).forEach(L=>{L.items.sort((a,b)=>a.x-b.x);const cells=[];
      L.items.forEach(it=>{const c=cells[cells.length-1];if(c&&it.x-c.x1<Math.max(5,it.h*0.8)){c.t+=(it.x-c.x1>1?' ':'')+it.s;c.x1=Math.max(c.x1,it.x+it.w)}else cells.push({t:it.s,x0:it.x,x1:it.x+it.w})});
      cells.forEach(c=>c.t=c.t.trim());rows.push(cells);text+=cells.map(c=>c.t).join('   ')+'\n'});
    text+='\n';
  }

}
// Reconstruye la tabla de un PDF usando las posiciones de la fila de cabecera (días o comidas)
function gridFromPositioned(posRows,ctx){
  const out=[];let anchors=null;
  for(const cells of posRows){
    const dayC=cells.filter(c=>matchDay(c.t)),mealC=cells.filter(c=>matchMeal(c.t,false));
    const hdr=dayC.length>=3?dayC:mealC.length>=3?mealC:null;
    if(hdr){anchors=hdr.map(c=>(c.x0+c.x1)/2);anchors.minX=Math.min(...hdr.map(c=>c.x0));out.push(['',...hdr.map(c=>c.t)]);continue}
    if(!anchors){out.push([cells.map(c=>c.t).join(' ')]);continue}
    const row=new Array(anchors.length+1).fill('');
    cells.forEach(c=>{const cx=(c.x0+c.x1)/2;if(c.x1<=anchors.minX+2){row[0]=(row[0]?row[0]+' ':'')+c.t;return}

    out.push(row);

// ── Punto de entrada ──

  if(!weeks.length)return {ok:false,text,kind};
  let meals=0,withCal=0,withIng=0,fromBank=0;const days=new Set();
  weeks.forEach((w,wi)=>WEEK_DAYS.forEach(d=>{const ms=Object.values(w[d]);if(ms.length)days.add(wi+d);ms.forEach(x=>{meals++;if(x.cal)withCal++;if(x.ingredients&&x.ingredients.length)withIng++;if(x.fromBank)fromBank++})}));
  const notes=[...(res.notes||[])];
  if(withCal<meals)notes.push((meals-withCal)+' de '+meals+' comidas no traen calorías en el documento. Puedes completarlas en el editor.');
  const missingTypes=MEAL_TYPES.filter(t=>!weeks.some(w=>WEEK_DAYS.some(d=>w[d][t])));
  if(missingTypes.length&&missingTypes.length<5)notes.push('El documento no incluye: '+missingTypes.join(', ')+'.');
  const base=(fileName||'').replace(/\.[a-z0-9]+$/i,'').replace(/[_-]+/g,' ').trim();
  return {ok:true,weeks,kind,format:res.format,title:(res.title||base||'Dieta importada').slice(0,80),text,
    stats:{weeks:weeks.length,days:days.size,meals,withCal,withIng,fromBank},notes};
}
async function importDietFile(file,ctx){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){const {rows,text}=await readPdf(file);const g=gridFromPositioned(rows,ctx);return finishImport((g&&parseDietRows(g,ctx))||parseDietText(text,ctx),text,'PDF',ctx,file.name)}
  if(['xlsx','xls','ods'].includes(ext)){const sheets=await readXlsx(file);const text=sheets.map(s=>s.rows.map(r=>r.join('\t')).join('\n')).join('\n\n');
    const raw=[];let format='',title='';sheets.forEach(s=>{const r=parseDietRows(s.rows,ctx);if(r){raw.push(...r.raw);format=r.format;if(!title&&r.title)title=r.title}});
    return finishImport(raw.length?{raw,format:format+(sheets.length>1?' · '+sheets.length+' hojas':''),title}:parseDietText(text,ctx),text,'Excel',ctx,file.name)}
  if(ext==='csv'){const text=await file.text();const rows=parseCSV(text);return finishImport(parseDietRows(rows,ctx)||parseDietText(rows.map(r=>r.join(' ')).join('\n'),ctx),text,'CSV',ctx,file.name)}
  if(ext==='docx'){const {rows,text,hasTable}=await readDocx(file);return finishImport((hasTable&&parseDietRows(rows,ctx))||parseDietText(text,ctx),text,'Word',ctx,file.name)}
  if(['txt','md'].includes(ext)){const text=await file.text();return importDietText(text,ctx,file.name)}
  if(ext==='doc')throw new Error('Los archivos .doc antiguos no se pueden leer. Ábrelo en Word y guárdalo como .docx o PDF.');
  throw new Error('Formato no admitido. Usa PDF, Word (.docx), Excel (.xlsx), CSV o texto.');
}
function importDietText(text,ctx,fileName){
  const t=String(text||'');
  if(t.includes('\t')){const rows=t.replace(/\r/g,'').split('\n').map(l=>l.split('\t'));const r=parseDietRows(rows,ctx);if(r)return finishImport(r,t,'Texto pegado',ctx,fileName)}
  return finishImport(parseDietText(t,ctx),t,'Texto pegado',ctx,fileName);
}
// Plantilla descargable: formato que se importa siempre sin errores
function downloadDietTemplate(){
  const rows=[['Semana 1','','','','','','',''],['',...WEEK_DAYS],...MEAL_TYPES.map(m=>[m,'','','','','','',''])];
  rows[2][1]='Tostada integral con tomate y aceite 320 kcal';rows[4][1]='Lentejas con verduras 540 kcal';
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='plantilla-dieta-'+APP_NAME.toLowerCase()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);

// Convierte la respuesta de la IA del servidor al mismo formato que la lectura automática
function aiImportResult(ai,base,ctx){
  const raw=(ai.weeks||[]).map(w=>{const o={};WEEK_DAYS.forEach(d=>{o[d]={};MEAL_TYPES.forEach(m=>{const x=w&&w[d]&&w[d][m];if(x&&x.name)o[d][m]=x.name+(x.cal?' '+x.cal+' kcal':'')})});return o});
  const r=finishImport({raw,format:'Interpretada con IA'},base.text,base.kind,ctx,'');
  if(!r.ok)return base;
  r.title=ai.name||base.title||r.title;r.engine='ia';return r;
}

// ═══ CALORÍAS RECOMENDADAS (Mifflin-St Jeor) ═══
function patientAge(p){const b=p&&(p.birth||p.birthDate);if(!b)return null;const t=new Date(b);if(isNaN(t.getTime()))return null;const a=Math.floor((Date.now()-t.getTime())/31557600000);return a>0&&a<110?a:null}
function recommendKcal(p){
  if(!p)return null;const w=parseFloat(p.w),h=parseFloat(p.h);if(!w||!h)return null;
  const realAge=patientAge(p);const age=realAge||40;const sx=nrm(p.sex||'');
  const male=/^(hombre|h|masc|male|varon)/.test(sx),female=/^(mujer|f|fem|female)/.test(sx);
  const tmb=10*w+6.25*h-5*age+(male?5:female?-161:-78);
  const ACT={sedentario:1.2,ligero:1.375,moderado:1.55,activo:1.725,'muy activo':1.9};
  const act=(typeof p.activityLevel==='number'&&p.activityLevel>=1&&p.activityLevel<=2.5)?p.activityLevel:(ACT[nrm(p.activityLevel||p.activity||'')]||1.375);
  let adj=0,why='mantenimiento';const tg=parseFloat(p.tg);
  if(tg&&w-tg>1){adj=-400;why='pérdida de peso'}else if(tg&&tg-w>1){adj=300;why='ganancia de peso'}
  const kcal=Math.max(male?1500:1200,Math.round((tmb*act+adj)/50)*50);
  return {kcal,tmb:Math.round(tmb),act,adj,why,age,ageKnown:!!realAge,sexKnown:male||female};
}
// Alimentos a evitar por interacciones de severidad ALTA con la medicación del paciente
function medExclusions(p,fms){
  const out=[];((p&&p.medicacion)||[]).forEach(n=>{const f=(fms||[]).find(x=>x.nombre===n);((f&&f.interacciones)||[]).forEach(it=>{if(it.severidad==='alta')(it.alimentos||[]).forEach(a=>{if(!out.some(o=>o.a===a))out.push({a,f:n})})})});
  return out;
}
// Choques entre la dieta y las alergias / aversiones del paciente
function allergyConflicts(weeks,p){
  const bad=[...((p&&p.allergies)||[]),...((p&&p.dislikes)||[])].map(x=>String(x).trim()).filter(Boolean);if(!bad.length)return [];
  const hits=[];(weeks||[]).forEach(w=>WEEK_DAYS.forEach(d=>Object.entries(w[d]||{}).forEach(([m,x])=>{const txt=nrm(x.name+' '+(x.ingredients||[]).map(ingText).join(' '));bad.forEach(b=>{const nb=nrm(b);if(nb&&txt.includes(nb)&&!hits.some(h=>h.b===b&&h.d===d&&h.m===m))hits.push({b,d,m,name:x.name})})})));
  return hits;
}

function useHomeLayout(key,defaults,valid){
  const lsKey='nusal_home_'+key;
  const clean=a=>Array.isArray(a)?a.filter((x,i)=>valid.includes(x)&&a.indexOf(x)===i):null;
  const [layout,setLayout]=useState(()=>{try{return clean(JSON.parse(localStorage.getItem(lsKey)||'null'))||defaults}catch(e){return defaults}});
  useEffect(()=>{let on=true;if(DB.ready&&DB.getHomeLayout)DB.getHomeLayout().then(r=>{const c=clean(r);if(on&&c&&c.length){setLayout(c);try{localStorage.setItem(lsKey,JSON.stringify(c))}catch(e){}}});return()=>{on=false}},[lsKey]);
  const save=l=>{setLayout(l);try{localStorage.setItem(lsKey,JSON.stringify(l))}catch(e){}if(DB.saveHomeLayout)DB.saveHomeLayout(l)};

}
function Switch({on,onClick}){return <button onClick={onClick} className="press" aria-pressed={on} style={{width:51,height:31,flex:'0 0 51px',borderRadius:50,border:'none',background:on?GN:'#E9E9EB',position:'relative',cursor:'pointer',transition:'background .2s'}}><span style={{position:'absolute',top:2,left:on?22:2,width:27,height:27,borderRadius:'50%',background:'#fff',boxShadow:'0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)',transition:'left .2s'}}/></button>}
function HomeCustomizer({catalog,layout,defaults,onSave,onClose}){
  const [sel,setSel]=useState(layout);
  const move=(id,dir)=>{const i=sel.indexOf(id),j=i+dir;if(i<0||j<0||j>=sel.length)return;const n=[...sel];[n[i],n[j]]=[n[j],n[i]];setSel(n)};
  const toggle=id=>setSel(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const ordered=[...sel.map(id=>catalog.find(c=>c.id===id)).filter(Boolean),...catalog.filter(c=>!sel.includes(c.id))];
  const arrow=(dis,fn,ch)=><button onClick={fn} disabled={dis} className="press" style={{width:30,height:30,borderRadius:10,border:'none',background:dis?'transparent':PS,color:dis?'#D6CEDD':P,fontWeight:900,fontSize:14,cursor:dis?'default':'pointer'}}>{ch}</button>;

      {on&&arrow(i===0,()=>move(c.id,-1),'↑')}{on&&arrow(i===sel.length-1,()=>move(c.id,1),'↓')}
      <Switch on={on} onClick={()=>toggle(c.id)}/>
    </div>})}
    <div style={{display:'flex',gap:8,marginTop:14,flexWrap:'wrap'}}>
      <button onClick={()=>setSel(defaults)} className="press" style={{background:'none',border:'none',color:TS,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit',padding:'10px 4px'}}>Restablecer</button>

      <Btn onClick={()=>{onSave(sel);onClose()}} small><Icon n="check" size={15}/>Guardar</Btn>
    </div>
  </Cd>;
}

function HistorialClinico({patient,onUp}){
  const lsKey='nusal_clinical_'+patient.id;
  const [d,setD]=useState(null);const [meta,setMeta]=useState({});const [open,setOpen]=useState('personales');const [st,setSt]=useState('saved');const [err,setErr]=useState('');
  const seq=useRef(0);const savedSeq=useRef(0);const base=useRef(null);const dRef=useRef(null);dRef.current=d;const saving=useRef(false);
  useEffect(()=>{let on=true;(async()=>{let r=null;if(DB.ready)r=await DB.getClinical(patient.id);if(!r){try{r=JSON.parse(localStorage.getItem(lsKey)||'null')}catch(e){}}
    const data={...((r&&r.data)||{})};const pre=(k,v)=>{if(!hcFilled(data[k])&&hcFilled(v))data[k]=v};
    pre('fechaNac',patient.birth);pre('sexo',['Mujer','Hombre','Otro'].includes(patient.sex)?patient.sex:'');pre('dni',patient.dni);pre('telefono',patient.phone);pre('alergias',patient.allergies||[]);pre('aversiones',(patient.dislikes||[]).join(', '));
    const act=Object.keys(ACT_MAP).find(k=>ACT_MAP[k]===patient.activityLevel);pre('actividad',act||'');
    if(on){setD(data);setMeta(r||{});base.current=r&&r.updatedAt?new Date(r.updatedAt).toISOString():null}})();return()=>{on=false}},[patient.id]);
  const ro=!!meta.archived;
  function syncProfile(x){const patch={};const set=(k,v)=>{if(JSON.stringify(patient[k]??'')!==JSON.stringify(v??''))patch[k]=v};
    if(x.dni!==undefined)set('dni',x.dni||'');if(x.telefono!==undefined)set('phone',x.telefono||'');if(x.sexo)set('sex',x.sexo);if(x.fechaNac)set('birth',x.fechaNac);
    if(Array.isArray(x.alergias))set('allergies',x.alergias);if(typeof x.aversiones==='string')set('dislikes',x.aversiones.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean));if(ACT_MAP[x.actividad])set('activityLevel',ACT_MAP[x.actividad]);
    if(Object.keys(patch).length&&onUp)onUp(patient.id,patch)}
  async function save(auto,force){
    if(saving.current||ro||!dRef.current)return;saving.current=true;const mySeq=seq.current;const data=dRef.current;setSt('saving');
    let r;if(DB.ready)r=await DB.saveClinical(patient.id,data,force?null:base.current,auto);
    else{const now=new Date().toISOString();try{localStorage.setItem(lsKey,JSON.stringify({data,updatedAt:now,updatedBy:'Demo'}));r={ok:true,updatedAt:now,updatedBy:'Demo',newVersion:false}}catch(e){r={error:'No se pudo guardar en este navegador.'}}}
    saving.current=false;
    if(r&&r.conflict){setSt('conflict');const when=r.updatedAt?new Date(r.updatedAt).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';
      if(await nConfirm((r.updatedBy||'Otra sesión')+' guardó cambios en este historial'+(when?' a las '+when:'')+'. ¿Cargas su versión? Si eliges «Mantener la mía», se guardará la tuya encima.',{title:'El historial ha cambiado',ok:'Cargar la suya',cancel:'Mantener la mía'})){
        const g=await DB.getClinical(patient.id);if(g){setD(g.data||{});setMeta(g);base.current=g.updatedAt?new Date(g.updatedAt).toISOString():null;seq.current=savedSeq.current;setSt('saved')}}
      else save(auto,true);return}
    if(!r||r.error||!r.ok){setSt('error');setErr((r&&r.error)||'No se pudo guardar.');setTimeout(()=>{if(seq.current!==savedSeq.current)save(true)},10000);return}
    base.current=r.updatedAt?new Date(r.updatedAt).toISOString():null;savedSeq.current=mySeq;setErr('');
    setMeta(m=>({...m,updatedAt:r.updatedAt,updatedBy:r.updatedBy,history:r.newVersion?[{savedAt:r.updatedAt},...(m.history||[])]:(m.history&&m.history.length?m.history:[{savedAt:r.updatedAt}])}));
    syncProfile(data);setSt(seq.current===mySeq?'saved':'dirty');
  }
  const saveRef=useRef(save);saveRef.current=save;
  useEffect(()=>{if(st!=='dirty')return;const t=setTimeout(()=>saveRef.current(true),2000);return()=>clearTimeout(t)},[st,d]);
  useEffect(()=>{const h=e=>{if(seq.current!==savedSeq.current){e.preventDefault();e.returnValue=''}};window.addEventListener('beforeunload',h);return()=>{window.removeEventListener('beforeunload',h);if(seq.current!==savedSeq.current)saveRef.current(true)}},[]);
  if(!d)return <Cd style={{padding:24,textAlign:'center'}}><p style={{color:TM}}>Cargando historial clínico…</p></Cd>;
  const set=(k,v)=>{if(ro)return;seq.current++;setD(p=>({...p,[k]:v}));setSt('dirty')};
  const chipBtn=(on,label,fn,small)=><button key={label} disabled={ro} onClick={fn} className="press" style={{padding:small?'5px 9px':'7px 12px',borderRadius:50,border:'none',fontSize:small?12:13,fontWeight:600,fontFamily:'inherit',background:on?P:'rgba(118,118,128,.12)',color:on?'#fff':TX,cursor:ro?'default':'pointer'}}>{label}</button>;
  function field(f){const v=d[f.k];
    if(f.type==='seg')return <Seg ro={ro} value={v} opts={f.o} onChange={x=>set(f.k,x)}/>;

function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}

      {!DB.ready&&row('Disponible al conectar el servidor','En la demo no hay servidor que copiar.')}

        {bk&&!(bk.backups||[]).length&&row('Todavía no hay copias','La primera se hace sola al arrancar el servidor.')}
        <div style={{padding:'12px 16px',borderTop:'0.5px solid '+BD}}><Btn full disabled={busy} onClick={async()=>{setBusy(true);const r=await DB.createBackup();setBusy(false);if(r&&r.ok){await nAlert('Copia creada correctamente.');load()}else await nAlert('No se pudo crear la copia.')}}>{busy?'Creando copia…':'Hacer una copia ahora'}</Btn></div>

      {DB.ready&&(arch||[]).map(a=>row(a.name,'Baja '+new Date(a.archivedAt).toLocaleDateString('es-ES')+' · se conserva hasta '+new Date(a.retainUntil).toLocaleDateString('es-ES'),<button onClick={async()=>{const d=await DB.exportPatient(a.id);if(d)downloadJSON(d,'historia-'+String(a.name).replace(/\s+/g,'-').toLowerCase()+'.json')}} className="press" style={{border:'none',background:'none',color:P,fontSize:15,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Exportar</button>,a.id))}

// ═══ PRÓXIMA CITA DEL PACIENTE ═══
function nextApptFor(appts,pid){const t=todayIso();return (appts||[]).filter(a=>String(a.patientId)===String(pid)&&a.date>=t).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')))[0]||null}
function apptInfo(a){const days=Math.round((new Date(a.date+'T00:00')-new Date(todayIso()+'T00:00'))/86400000);let long='';try{long=new Date(a.date+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}catch(e){long=a.date}
  return {long:long.charAt(0).toUpperCase()+long.slice(1),time:a.time||'',rel:days===0?'Hoy':days===1?'Mañana':'Dentro de '+days+' días',soon:days<=1}}
function downloadICS(a){
  const dt=a.date.replace(/-/g,'')+'T'+String(a.time||'09:00').replace(':','').padEnd(4,'0')+'00';
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//'+APP_NAME+'//ES','BEGIN:VEVENT','UID:'+(a.id||Date.now())+'@'+APP_NAME.toLowerCase(),'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z','DTSTART;TZID=Europe/Madrid:'+dt,'DURATION:PT45M','SUMMARY:Cita en '+APP_NAME];
  if(a.note)L.push('DESCRIPTION:'+String(a.note).replace(/[\r\n]+/g,' '));
  L.push('BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Cita en '+APP_NAME,'END:VALARM','END:VEVENT','END:VCALENDAR');
  const u=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar'}));const x=document.createElement('a');x.href=u;x.download='cita-'+a.date+'.ics';x.click();setTimeout(()=>URL.revokeObjectURL(u),3000);
}

    <p className="sf" style={{fontSize:26,lineHeight:1.15,textDecoration:off?'line-through':'none'}}>{i.long}</p>
    {i.time&&<p className="sf" style={{fontSize:46,lineHeight:1.05,marginTop:2,letterSpacing:-1,textDecoration:off?'line-through':'none'}}>{i.time}<span style={{fontSize:18,fontWeight:600,opacity:.85,marginLeft:6}}>h</span></p>}
    {appt.note&&!off&&<p style={{fontSize:14,opacity:.92,marginTop:6}}>{appt.note}</p>}
    {st==='confirmada'&&<p style={{marginTop:10,fontSize:14,fontWeight:700,display:'flex',alignItems:'center',gap:6}}><Icon n="check" size={16} color="#fff"/>Asistencia confirmada</p>}

    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:14}}>
      {st==='pendiente'&&<><button onClick={()=>onStatus&&onStatus(appt.id,'confirmada')} className="press" style={{...pill,background:'#fff',color:'#E0245E'}}><Icon n="check" size={15} color="#E0245E"/>Confirmo asistencia</button><button onClick={ask} className="press" style={{...pill,background:'rgba(255,255,255,.22)',color:'#fff'}}>No puedo ir</button></>}

function safeImage(f,maxPx,type){return new Promise((res,rej)=>{
  if(!f||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(f.type||''))return rej(new Error('Elige una foto en formato JPG, PNG o WebP.'));
  if(f.size>15*1024*1024)return rej(new Error('La imagen es demasiado grande (máximo 15 MB).'));
  const u=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{const k=Math.min(1,maxPx/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type||'image/jpeg',.85))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('No se pudo leer la imagen.'))};img.src=u;})}

function offToAlimento(p){const n=p.nutriments||{};const g=k=>{const v=parseFloat(n[k+'_100g']);return isFinite(v)?v:0};const r1=v=>Math.round(v*10)/10;

  return {nombre:(nm+(br&&!nm.toLowerCase().includes(br.toLowerCase())?' ('+br+')':'')).slice(0,120),kcal:Math.round(g('energy-kcal')||g('energy')/4.184),proteinas:r1(g('proteins')),hidratos:r1(g('carbohydrates')),azucares:r1(g('sugars')),grasas:r1(g('fat')),grasasSat:r1(g('saturated-fat')),fibra:r1(g('fiber')),sal:Math.round(g('salt')*100)/100,calcio:Math.round(g('calcium')*1000),hierro:r1(g('iron')*1000),vitD:r1(g('vitamin-d')*1e6),b12:r1(g('vitamin-b12')*1e6),potasio:Math.round(g('potassium')*1000)}}
async function offSearch(q){const code=q.replace(/\s/g,'');const isCode=/^\d{8,14}$/.test(code);const fields='code,product_name,product_name_es,brands,nutriments';

function scaleIng(s,f){s=typeof s==='string'?s:((s&&s.nombre)||'');if(!f||Math.abs(f-1)<0.001)return s;

      <div className="clay" style={{padding:0,overflow:'hidden',marginBottom:14}}>
        <div style={{padding:'13px 16px'}}><p style={{fontSize:16,fontWeight:700,color:TX}}>Suscribirme (se actualiza sola)</p><p style={{fontSize:13,color:TM}}>Las citas nuevas, los cambios y las confirmaciones aparecen solos.</p></div>
        {!DB.ready&&<div style={row}><p style={{fontSize:14,color:TM}}>Disponible con el servidor conectado.</p></div>}
        {DB.ready&&!url&&<div style={row}><button onClick={create} disabled={busy} style={link}>{busy?'Creando enlace…':'Crear mi enlace privado'}</button></div>}
        {DB.ready&&url&&<>
          <div style={row}><a href={url.replace(/^https?:/,'webcal:')} style={{...link,textDecoration:'none'}}>Abrir en Calendario (iPhone y Mac)</a></div>
          <div style={row}><button onClick={async()=>{try{await navigator.clipboard.writeText(url);setCopied(true)}catch(e){await nAlert(url)}}} style={link}>{copied?'Enlace copiado ✓':'Copiar enlace para Google Calendar'}</button></div>
          <div style={row}><p style={{fontSize:12.5,color:TM}}>En Google Calendar: Otros calendarios → + → Desde URL, y pega el enlace.</p></div>
          <div style={row}><button onClick={revoke} style={{...link,color:'#D70015'}}>Desactivar el enlace</button></div></>}
      </div>
      <div className="clay" style={{padding:0,overflow:'hidden',marginBottom:12}}>
        <div style={{padding:'13px 16px'}}><p style={{fontSize:16,fontWeight:700,color:TX}}>Descargar las próximas citas</p><p style={{fontSize:13,color:TM}}>Un archivo con las {future.length} citas pendientes. No se actualiza solo.</p></div>
        <div style={row}><button onClick={download} disabled={!future.length} style={{...link,opacity:future.length?1:.4}}>Descargar (.ics)</button></div>
      </div>
      <p style={{fontSize:12,color:TM,lineHeight:1.45}}>Por privacidad, en el calendario solo aparece el nombre y la inicial del apellido, sin notas clínicas. El enlace es secreto: si lo compartes por error, desactívalo y crea otro.</p>
    </div>
  </div>;
}

// ═══ REVISIÓN SEMANAL (idea de SparkyFitness) ═══
function weekStartLocal(d){d=d||new Date();const m=new Date(d.getFullYear(),d.getMonth(),d.getDate());m.setDate(m.getDate()-((m.getDay()+6)%7));return m.getFullYear()+'-'+String(m.getMonth()+1).padStart(2,'0')+'-'+String(m.getDate()).padStart(2,'0')}
const CHK_Q=[['energia','¿Cuánta energía has tenido?','Agotada','Mucha'],['hambre','¿Has pasado hambre?','Mucha','Nada'],['sueno','¿Cómo has dormido?','Muy mal','Muy bien'],['cumplimiento','¿Cuánto has seguido la dieta?','Nada','Toda']];
const CHK_L={energia:'Energía',hambre:'Saciedad',sueno:'Sueño',cumplimiento:'Dieta'};
const CHK_E=['😫','😕','😐','🙂','😄'];
const chkCol=v=>v<=2?'#D70015':v===3?'#C93400':'#248A3D';
function demoCheckins(){try{return JSON.parse(localStorage.getItem('nusal_checkins')||'{}')}catch(e){return {}}}
function saveDemoCheckin(pid,c){const all=demoCheckins();all[pid]=[c,...(all[pid]||[]).filter(x=>x.weekStart!==c.weekStart)].slice(0,12);try{localStorage.setItem('nusal_checkins',JSON.stringify(all))}catch(e){}}
async function loadCheckins(pid,mine){if(DB.ready){const r=mine?await DB.getMyCheckins():await DB.getPatientCheckins(pid);if(r)return mine?(r.checkins||[]):r}return demoCheckins()[pid]||[]}
function CheckinCard({patient}){
  const wk=weekStartLocal();const [list,setList]=useState(null);const [ans,setAns]=useState({});const [nota,setNota]=useState('');const [busy,setBusy]=useState(false);const [edit,setEdit]=useState(false);
  useEffect(()=>{let on=true;loadCheckins(patient.id,true).then(r=>{if(on)setList(r||[])});return()=>{on=false}},[patient.id]);
  if(!list)return null;
  const cur=list.find(c=>c.weekStart===wk);
  async function send(){setBusy(true);const c={weekStart:wk,...ans,nota:nota.trim()||null,createdAt:new Date().toISOString()};
    if(DB.ready){const r=await DB.sendCheckin({...ans,nota:nota.trim()||undefined});if(!r||r.error){setBusy(false);await nAlert((r&&r.error)||'No se pudo enviar. Inténtalo de nuevo.');return}}else saveDemoCheckin(patient.id,c);
    setList(l=>[c,...l.filter(x=>x.weekStart!==wk)]);setBusy(false);setEdit(false)}
  if(cur&&!edit)return <Cd style={{marginBottom:16,padding:16}}><WTitle ic="check" c="#248A3D" t="Revisión de la semana enviada" right={<button onClick={()=>{setAns({energia:cur.energia,hambre:cur.hambre,sueno:cur.sueno,cumplimiento:cur.cumplimiento});setNota(cur.nota||'');setEdit(true)}} className="press" style={{border:'none',background:'none',color:P,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Cambiar</button>}/>
    <div style={{display:'flex',gap:6}}>{CHK_Q.map(([k])=><div key={k} style={{flex:1,textAlign:'center',background:'rgba(118,118,128,.08)',borderRadius:12,padding:'8px 4px'}}><p style={{fontSize:22}}>{CHK_E[(cur[k]||3)-1]}</p><p style={{fontSize:11,color:TM,fontWeight:600}}>{CHK_L[k]}</p></div>)}</div>
    <p style={{fontSize:12.5,color:TM,marginTop:10}}>Gracias. Tu nutricionista lo verá antes de tu próxima consulta.</p></Cd>;
  const ready=CHK_Q.every(([k])=>ans[k]);
  return <Cd style={{marginBottom:16,padding:16,border:'1.5px solid '+PB}}><WTitle ic="sparkles" c={P} t="Tu revisión de esta semana"/>
    <p style={{fontSize:13,color:TS,marginBottom:12}}>Cuatro preguntas rápidas para que tu nutricionista sepa cómo vas.</p>
    {CHK_Q.map(([k,q,lo,hi])=><div key={k} style={{marginBottom:12}}><p style={{fontSize:14.5,fontWeight:600,color:TX,marginBottom:6}}>{q}</p>
      <div style={{display:'flex',gap:6}}>{CHK_E.map((e,i)=>{const on=ans[k]===i+1;return <button key={i} onClick={()=>setAns(a=>({...a,[k]:i+1}))} aria-label={q+' '+(i+1)+' de 5'} aria-pressed={on} className="press" style={{flex:1,padding:'8px 0',fontSize:22,borderRadius:12,border:'none',background:on?P:'rgba(118,118,128,.1)',boxShadow:on?'0 2px 8px rgba(123,45,142,.3)':'none',cursor:'pointer'}}>{e}</button>})}</div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:TM,marginTop:3}}><span>{lo}</span><span>{hi}</span></div></div>)}
    <textarea rows={2} value={nota} onChange={e=>setNota(e.target.value.slice(0,500))} placeholder="¿Algo que quieras contarle? (opcional)" style={{width:'100%',padding:'10px 12px',fontSize:15,fontFamily:'inherit',marginBottom:10,resize:'vertical'}}/>
    <Btn onClick={send} full disabled={!ready||busy}>{busy?'Enviando…':'Enviar revisión'}</Btn></Cd>;
}
function CheckinTrends({patient}){
  const [list,setList]=useState(null);
  useEffect(()=>{let on=true;loadCheckins(patient.id,false).then(r=>{if(on)setList(r||[])});return()=>{on=false}},[patient.id]);
  if(!list)return null;
  const rows=[...list].sort((a,b)=>a.weekStart.localeCompare(b.weekStart)).slice(-6);const last=rows[rows.length-1];
  return <Cd style={{marginBottom:12,padding:16}}><WTitle ic="sparkles" c={P} t="Revisiones semanales" right={list.length>0&&<span style={{fontSize:12,color:TM}}>{list.length} enviadas</span>}/>
    {!rows.length?<p style={{fontSize:13,color:TM}}>Todavía no ha enviado ninguna. Le aparece cada semana en su pantalla de inicio.</p>:<>
    <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'separate',borderSpacing:4}}><thead><tr><th/>{rows.map(c=><th key={c.weekStart} style={{fontSize:11,color:TM,fontWeight:600}}>{c.weekStart.slice(8,10)+'/'+c.weekStart.slice(5,7)}</th>)}</tr></thead>
    <tbody>{Object.keys(CHK_L).map(k=><tr key={k}><td style={{fontSize:12.5,fontWeight:600,color:TS,whiteSpace:'nowrap'}}>{CHK_L[k]}</td>{rows.map(c=><td key={c.weekStart} style={{textAlign:'center'}}><span style={{display:'inline-flex',width:28,height:28,borderRadius:'50%',alignItems:'center',justifyContent:'center',background:chkCol(c[k])+'1F',color:chkCol(c[k]),fontWeight:800,fontSize:13}}>{c[k]}</span></td>)}</tr>)}</tbody></table></div>
    {last&&last.nota&&<p style={{fontSize:13,color:TX,background:'rgba(118,118,128,.08)',borderRadius:12,padding:'9px 12px',marginTop:8}}><b>Última nota:</b> {last.nota}</p>}
    <p style={{fontSize:11.5,color:TM,marginTop:8}}>Escala del 1 al 5 (5 = mejor). En rojo, lo que necesita atención.</p></>}
  </Cd>;
}
function ChkWeekWidget({patients,onSel}){
  const [rows,setRows]=useState(null);const wk=weekStartLocal();
  useEffect(()=>{let on=true;(async()=>{let r=null;if(DB.ready){const x=await DB.getWeekCheckins();r=x?x.checkins:null}else{const all=demoCheckins();r=Object.keys(all).map(pid=>{const c=(all[pid]||[]).find(c=>c.weekStart===wk);const p=patients.find(pp=>String(pp.id)===String(pid));return c?{...c,patientId:pid,name:p?p.nm:'Paciente'}:null}).filter(Boolean)}if(on)setRows(r||[])})();return()=>{on=false}},[]);
  if(!rows)return null;
  const alerts=rows.filter(c=>Object.keys(CHK_L).some(k=>c[k]<=2));
  return <Cd style={{marginBottom:16,padding:16}}><WTitle ic="sparkles" c={P} t="Revisiones de esta semana" right={<span style={{fontSize:12,fontWeight:800,color:P}}>{rows.length}/{patients.length}</span>}/>
    {!rows.length&&<p style={{fontSize:13,color:TM}}>Nadie ha enviado su revisión todavía esta semana.</p>}
    {alerts.map(c=>{const p=patients.find(x=>String(x.id)===String(c.patientId));return <div key={c.patientId} onClick={()=>p&&onSel(p.id)} className="press" style={{padding:'9px 0',borderBottom:'0.5px solid '+BD,cursor:'pointer'}}><p style={{fontSize:14,fontWeight:600,color:TX}}>{c.name||(p&&p.nm)}</p><p style={{fontSize:12.5,color:'#C93400'}}>Necesita atención: {Object.keys(CHK_L).filter(k=>c[k]<=2).map(k=>CHK_L[k].toLowerCase()+' '+c[k]+'/5').join(', ')}</p>{c.nota&&<p style={{fontSize:12.5,color:TS,fontStyle:'italic'}}>«{c.nota}»</p>}</div>})}
    {rows.length>0&&!alerts.length&&<p style={{fontSize:13,color:'#248A3D'}}>Todas las revisiones de esta semana van bien.</p>}
  </Cd>;
}


// ═══ DASHBOARD DE PACIENTES ═══
const fmtShort=d=>{try{const x=d instanceof Date?d:new Date(String(d).length===10?d+'T12:00':d);return isNaN(x)?'':String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+x.getFullYear()}catch(e){return ''}};
const APPT_ST={confirmada:'Confirmada',cancelada:'No puede ir',pendiente:'Sin confirmar'};
const LI_TXT={green:'Bien',yellow:'Irregular',red:'Atención'};
function dashRows(patients,appts,diets,weekChk){return patients.map(p=>{
  const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null};const h=n(p.h),w=n(p.w),sw=n(p.sw)??w,tg=n(p.tg);
  const lost=sw!=null&&w!=null?Math.round((sw-w)*10)/10:null;const lostPct=sw&&lost!=null?Math.round(lost/sw*1000)/10:null;
  const prog=sw!=null&&tg!=null&&w!=null&&sw!==tg?Math.max(0,Math.min(100,Math.round((sw-w)/(sw-tg)*100))):null;
  const imc=h&&w?Math.round(w/((h/100)**2)*10)/10:null;const imcCat=imc==null?'':imc<18.5?'Bajo peso':imc<25?'Normal':imc<30?'Sobrepeso':imc<35?'Obesidad I':imc<40?'Obesidad II':'Obesidad III';
  const ar=p.createdAt||p.alta||null;const alta=ar&&!isNaN(new Date(ar))?new Date(ar):null;const weeks=alta?Math.max(0,Math.floor((Date.now()-alta)/604800000)):(p.wk??null);
  const na=nextApptFor(appts,p.id);const diet=diets.find(d=>d.id===p.dietId);const md=p.mealsDone||{};const ks=Object.keys(md);
  const chk=weekChk[String(p.id)]||null;
  return {p,id:p.id,nm:p.nm||'',email:p.email||'',phone:p.phone||'',age:patientAge(p),sex:p.sex||'',h,sw,w,tg,lost,lostPct,prog,imc,imcCat,alta,weeks,na,
    apptTxt:na?fmtShort(na.date)+(na.time?' · '+na.time:''):(p.nextAppt||''),apptSt:na?(na.status||'pendiente'):'',dietName:diet?diet.name:'',
    adh:ks.length?Math.round(ks.filter(k=>md[k]).length/ks.length*100):null,chk,chkAlert:!!(chk&&Object.keys(CHK_L).some(k=>chk[k]<=2)),
    li:p.li||'',paid:!!p.paid,meds:(p.medicacion||[]).length,allergies:(p.allergies||[]).join(', ')}})}
function exportRecord(r){return {'Nombre y apellidos':r.nm,'Email':r.email,'Teléfono':r.phone,'Edad':r.age??'','Sexo':r.sex,'Altura (cm)':r.h??'','Peso inicial (kg)':r.sw??'','Peso actual (kg)':r.w??'','Peso objetivo (kg)':r.tg??'','Peso perdido (kg)':r.lost??'','Peso perdido (%)':r.lostPct??'','Progreso al objetivo (%)':r.prog??'','IMC':r.imc??'','Clasificación IMC':r.imcCat,'Fecha de alta':r.alta?fmtShort(r.alta):'','Semanas en tratamiento':r.weeks??'','Próxima cita':r.apptTxt,'Estado de la cita':APPT_ST[r.apptSt]||'','Dieta asignada':r.dietName,'Adherencia (%)':r.adh??'','Revisión semanal':r.chk?(r.chkAlert?'Necesita atención':'Bien'):'','Medicación (nº)':r.meds,'Alergias':r.allergies,'Seguimiento':LI_TXT[r.li]||'','Pago':r.paid?'Al día':'Pendiente'}}
const fileBase=()=>APP_NAME.toLowerCase()+'-pacientes-'+todayIso();
function saveBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
async function exportXlsx(rows,name){const X=await loadExcelLib();const data=rows.map(r=>r.__raw?r.__raw:exportRecord(r));const H=Object.keys(data[0]||{});const wb=new X.Workbook();wb.creator=APP_NAME;const ws=wb.addWorksheet('Pacientes');ws.columns=H.map(k=>({header:k,key:k,width:Math.max(10,Math.min(42,k.length+4))}));data.forEach(d=>ws.addRow(d));ws.getRow(1).font={bold:true,color:{argb:'FFFFFFFF'}};ws.getRow(1).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF7B2D8E'}};if(H.length)ws.autoFilter={from:{row:1,column:1},to:{row:1,column:H.length}};ws.views=[{state:'frozen',ySplit:1}];const buf=await wb.xlsx.writeBuffer();saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),(name||fileBase())+'.xlsx')}
function exportCsv(rows){const data=rows.map(exportRecord);const H=Object.keys(data[0]||exportRecord(dashRows([{}],[],[],{})[0]));const q=v=>{const s=typeof v==='number'?String(v).replace('.',','):String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  saveBlob(new Blob(['\ufeff'+[H.join(';'),...data.map(r=>H.map(h=>q(r[h])).join(';'))].join('\r\n')],{type:'text/csv;charset=utf-8'}),fileBase()+'.csv')}
// .docx auténtico (OOXML) generado en el navegador: ZIP sin compresión + CRC32
const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=_crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files,type){const enc=new TextEncoder();const parts=[],cen=[];let off=0;const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  for(const f of files){const nm=enc.encode(f.name),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+d.length}
  const cs=cen.reduce((a,b)=>a+b.length,0);return new Blob([...parts,...cen,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)])],{type})}
const xe=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function docxBlob(title,sub,headers,rows){
  const run=(t,o={})=>`<w:r><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri"/>${o.b?'<w:b/>':''}${o.c?`<w:color w:val="${o.c}"/>`:''}<w:sz w:val="${o.sz||17}"/></w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  const par=(t,o={})=>`<w:p><w:pPr><w:spacing w:after="${o.after??80}"/></w:pPr>${run(t,o)}</w:p>`;
  const cw=Math.floor(15398/headers.length);
  const cell=(t,hd)=>`<w:tc><w:tcPr><w:tcW w:w="${cw}" w:type="dxa"/>${hd?'<w:shd w:val="clear" w:color="auto" w:fill="7B2D8E"/>':''}</w:tcPr><w:p><w:pPr><w:spacing w:after="0"/></w:pPr>${run(t,hd?{b:1,c:'FFFFFF'}:{})}</w:p></w:tc>`;
  const tr=(cs,hd)=>`<w:tr>${hd?'<w:trPr><w:tblHeader/></w:trPr>':''}${cs.map(c=>cell(c,hd)).join('')}</w:tr>`;
  const bd=['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="D1D1D6"/>`).join('');
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${par(title,{b:1,sz:32,c:'7B2D8E',after:40})}${par(sub,{sz:18,c:'6E6E73',after:200})}<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${bd}</w:tblBorders></w:tblPr><w:tblGrid>${headers.map(()=>`<w:gridCol w:w="${cw}"/>`).join('')}</w:tblGrid>${tr(headers,true)}${rows.map(r=>tr(r)).join('')}</w:tbl><w:p/><w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  return zipStore([{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'},{name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},{name:'word/document.xml',data:doc}],'application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
const WORD_COLS=[['Paciente',r=>r.nm],['Edad',r=>r.age??''],['Altura',r=>r.h?r.h+' cm':''],['Peso actual',r=>r.w!=null?r.w+' kg':''],['Perdido',r=>r.lost!=null?r.lost+' kg ('+r.lostPct+'%)':''],['IMC',r=>r.imc?r.imc+' · '+r.imcCat:''],['Alta',r=>r.alta?fmtShort(r.alta):''],['Próxima cita',r=>r.apptTxt+(r.apptSt?' · '+APPT_ST[r.apptSt]:'')],['Dieta',r=>r.dietName],['Seguimiento',r=>LI_TXT[r.li]||'']];

// ═══ IMPORTAR PACIENTES (Excel, CSV, Word, texto) ═══
const PCOL=[['nombre',/^(nombre( y apellidos| completo)?|paciente|name|nombre apellidos)$/],['apellidos',/^apellidos?$/],['email',/(e ?mail|correo)/],['telefono',/(telefono|movil|tlf|^tel$|phone|whatsapp)/],['dni',/^(dni|nif|nie|documento)/],['nacimiento',/(nacimiento|^f nac|birth)/],['edad',/^edad/],['sexo',/^(sexo|genero|sex)$/],['altura',/(altura|talla|estatura|height)/],['pesoInicial',/(peso inicial|peso de inicio|peso inicio|peso al alta|peso alta|peso de partida)/],['objetivo',/(objetivo|peso objetivo|^meta|target)/],['pesoActual',/(peso actual|ultimo peso|peso hoy|^peso( kg)?$)/],['alta',/(fecha de alta|^alta|fecha alta|fecha inicio|^inicio)/],['alergias',/(alergi|intoleranc)/],['notas',/(notas|observaciones|comentarios)/]];
function parseNum(v){const s=String(v??'').replace(/kg|cm|m\b/gi,'').replace(',','.').trim();const n=parseFloat(s);return isFinite(n)?n:null}
function parseDateEs(v){const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=y>40?1900:2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0].slice(0,10):null}
function strongPw(){const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';const r=new Uint32Array(10);crypto.getRandomValues(r);return Array.from(r,x=>A[x%A.length]).join('')}
function mapPatientRows(rowsIn,existing){
  const rows=cleanRows(rowsIn);let hi=-1,map=null;
  for(let i=0;i<Math.min(rows.length,10)&&hi<0;i++){const m={};rows[i].forEach((c,j)=>{const n=nrm(c);const hit=PCOL.find(([k,rx])=>rx.test(n)&&m[k]===undefined);if(hit)m[hit[0]]=j});if(m.nombre!==undefined&&Object.keys(m).length>=2){hi=i;map=m}}
  if(hi<0)return null;
  const seen=new Set((existing||[]).map(p=>String(p.email||'').toLowerCase()));const get=(r,k)=>map[k]!==undefined?String(r[map[k]]??'').trim():'';
  const items=rows.slice(hi+1).map(r=>{const nm=[get(r,'nombre'),get(r,'apellidos')].filter(Boolean).join(' ').replace(/\s+/g,' ');if(!nm)return null;
    const email=get(r,'email').toLowerCase();let birth=parseDateEs(get(r,'nacimiento'));const edad=parseNum(get(r,'edad'));let aprox=false;if(!birth&&edad&&edad>0&&edad<110){birth=(new Date().getFullYear()-Math.round(edad))+'-01-01';aprox=true}
    let h=parseNum(get(r,'altura'));if(h&&h<3)h=Math.round(h*100);const pi=parseNum(get(r,'pesoInicial')),pa=parseNum(get(r,'pesoActual'));const sx=nrm(get(r,'sexo'));
    const it={nm,email,phone:get(r,'telefono'),dni:get(r,'dni'),birth,aprox,sex:/^(m|mujer|f|fem)/.test(sx)?'Mujer':/^(h|hombre|v|varon|masc)/.test(sx)?'Hombre':'',h,sw:pi??pa,w:pa??pi,tg:parseNum(get(r,'objetivo')),alta:parseDateEs(get(r,'alta')),allergies:get(r,'alergias')?get(r,'alergias').split(/[,;]/).map(s=>s.trim()).filter(Boolean):[],notas:get(r,'notas'),issue:''};
    if(!email)it.issue='Falta el email (lo necesita para entrar en la app)';else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))it.issue='Email no válido';else if(seen.has(email))it.issue='Ya existe un paciente con este email';else seen.add(email);
    return it}).filter(Boolean);
  return {items,cols:Object.keys(map)};
}
function ImportPatientsSheet({patients,addPat,onImported,onClose}){
  const [res,setRes]=useState(null);const [err,setErr]=useState('');const [busy,setBusy]=useState(false);const [done,setDone]=useState(null);const [paste,setPaste]=useState('');const fileRef=useRef(null);
  async function handle(f){if(!f)return;setErr('');setBusy(true);try{const ext=(f.name.split('.').pop()||'').toLowerCase();let rows=null;
    if(['xlsx','xls','ods'].includes(ext)){const sh=await readXlsx(f);rows=(sh[0]||{}).rows}else if(ext==='csv'||ext==='txt'){const t=await f.text();rows=t.includes('\t')?t.split(/\r?\n/).map(l=>l.split('\t')):parseCSV(t)}else if(ext==='docx'){rows=(await readDocx(f)).rows}else throw new Error('Formato no admitido. Usa Excel, CSV, Word (.docx) o texto.');
    const m=mapPatientRows(rows||[],patients);if(!m||!m.items.length)throw new Error('No he encontrado una tabla de pacientes. La primera fila debe tener los títulos de columna (Nombre, Email, Peso…).');setRes(m)}catch(e){setErr(e.message||'No se pudo leer el archivo.')}setBusy(false);if(fileRef.current)fileRef.current.value=''}
  function fromPaste(){const m=mapPatientRows(paste.split(/\r?\n/).map(l=>l.split(/\t|;/)),patients);if(!m||!m.items.length){setErr('No he encontrado pacientes. Copia la tabla desde Excel incluyendo la fila de títulos.');return}setErr('');setRes(m)}
  function template(){saveBlob(new Blob(['\ufeffNombre;Apellidos;Email;Teléfono;DNI;Fecha de nacimiento;Sexo;Altura (cm);Peso inicial;Peso actual;Peso objetivo;Fecha de alta;Alergias;Notas\r\nMaría;García López;maria@correo.es;600000000;;15/04/1985;Mujer;168;82;76,2;72;10/01/2026;Lactosa;\r\n'],{type:'text/csv;charset=utf-8'}),'plantilla-pacientes-'+APP_NAME.toLowerCase()+'.csv')}
  async function run(){const ok=res.items.filter(i=>!i.issue);setBusy(true);const creds=[];const list=ok.map((i,k)=>{const pw=strongPw();creds.push({'Nombre y apellidos':i.nm,'Email':i.email,'Contraseña temporal':pw});return {...i,pw,id:Date.now()+k,li:'green',weights:i.w!=null?[{d:fmtShort(new Date()).slice(0,5),v:i.w}]:[],notes:i.notas?[{dt:fmtShort(new Date()),tx:i.notas}]:[],questions:[],medicacion:[]}});
    if(DB.ready){const r=await DB.bulkPatients(list.map(p=>({fullName:p.nm,email:p.email,password:p.pw,phone:p.phone||null,dni:p.dni||null,sex:p.sex||null,birthDate:p.birth||null,heightCm:p.h,startWeight:p.sw,currentWeight:p.w,targetWeight:p.tg,altaDate:p.alta||null})));
      if(!r||r.error){setBusy(false);await nAlert((r&&r.error)||'No se pudo importar.');return}
      const okR=r.results.filter(x=>x.ok);onImported(okR.map(x=>x.patient));setDone({n:okR.length,fail:r.results.filter(x=>!x.ok),creds:creds.filter(c=>okR.some(x=>x.email===c.Email))})}
    else{list.forEach(p=>addPat(p));setDone({n:list.length,fail:[],creds})}
    setBusy(false)}
  const ok=res?res.items.filter(i=>!i.issue).length:0;
  return <div className="pc-sheet-bg" onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.35)',zIndex:300,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
    <div className="pc-sheet anim" onClick={e=>e.stopPropagation()} style={{background:'#F2F2F7',borderRadius:'22px 22px 0 0',width:'100%',maxWidth:820,maxHeight:'92vh',overflowY:'auto',padding:'14px 16px 24px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}><p className="sf" style={{fontSize:22,color:TX}}>Importar pacientes</p><button onClick={onClose} aria-label="Cerrar" className="press" style={{width:30,height:30,borderRadius:'50%',border:'none',background:'rgba(118,118,128,.16)',color:TS,fontWeight:700,cursor:'pointer'}}>✕</button></div>
      {done?<><Cd style={{padding:16,marginBottom:12,background:'#E9F9EE'}}><p style={{fontSize:16,fontWeight:700,color:'#14532D'}}>{done.n} pacientes dados de alta</p>{done.fail.map((f,i)=><p key={i} style={{fontSize:13,color:'#8A4B00'}}>{f.email}: {f.error}</p>)}</Cd>
        {done.creds.length>0&&<Cd style={{padding:16}}><p style={{fontSize:15,fontWeight:700,color:TX}}>Accesos a la app</p><p style={{fontSize:13,color:TS,margin:'4px 0 12px'}}>Cada paciente tiene una contraseña temporal segura. Descárgalas y entrégalas en persona o por un canal seguro; podrán cambiarla al entrar.</p><Btn full onClick={()=>exportXlsx(done.creds.map(c=>({__raw:c})),'accesos-pacientes-'+todayIso())}><Icon n="download" size={15}/>Descargar accesos (Excel)</Btn></Cd>}</>
      :!res?<>
        <p style={{fontSize:13.5,color:TS,marginBottom:12}}>Sube tu listado de pacientes en Excel, CSV o Word, o pega la tabla. Reconozco solas las columnas: nombre, apellidos, email, teléfono, DNI, nacimiento o edad, sexo, altura, pesos, objetivo, fecha de alta, alergias y notas.</p>
        <div onClick={()=>fileRef.current&&fileRef.current.click()} className="press clay" style={{padding:'26px 16px',textAlign:'center',cursor:'pointer',border:'2px dashed #D1D1D6',marginBottom:12}}><p style={{fontSize:16,fontWeight:700,color:TX}}>{busy?'Leyendo…':'Elegir archivo'}</p><p style={{fontSize:13,color:TM}}>Excel · CSV · Word · texto</p><input ref={fileRef} type="file" accept=".xlsx,.csv,.txt,.docx" style={{display:'none'}} onChange={e=>handle(e.target.files&&e.target.files[0])}/></div>
        <textarea rows={4} value={paste} onChange={e=>setPaste(e.target.value)} placeholder="…o pega aquí la tabla copiada de Excel (con la fila de títulos)" style={{width:'100%',padding:'10px 12px',fontSize:14,fontFamily:'inherit',marginBottom:8}}/>
