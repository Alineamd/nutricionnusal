        <div style={{display:'flex',gap:10}}><button onClick={()=>setRes(null)} className="press" style={{flex:1,padding:13,borderRadius:14,border:'none',background:'rgba(118,118,128,.12)',color:TX,fontSize:15,fontWeight:600,fontFamily:'inherit',cursor:'pointer'}}>Volver</button><Btn onClick={run} disabled={!ok||busy}>{busy?'Importando…':'Importar '+ok+' pacientes'}</Btn></div></>}
    </div>
  </div>;
}

// ═══ AVISOS DE CITA DENTRO DE LA APP (paciente): el día antes pide confirmación; una hora antes, aviso ═══
function ApptReminder({appts,patient,onStatus}){
  const [now,setNow]=useState(Date.now());const [hide,setHide]=useState({});
  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(t)},[]);
  const a=nextApptFor(appts,patient.id);if(!a||a.status==='cancelada')return null;
  const mins=Math.round((new Date(a.date+'T'+(a.time||'09:00'))-now)/60000);const days=Math.round((new Date(a.date+'T00:00')-new Date(todayIso()+'T00:00'))/86400000);
  const kind=mins>0&&mins<=60?'hora':(days===1&&(a.status||'pendiente')==='pendiente'?'dia':null);if(!kind||hide[kind])return null;
  const key='nusal_aviso_'+a.id;let seen={};try{seen=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}if(seen[kind])return null;
  const close=()=>{seen[kind]=true;try{localStorage.setItem(key,JSON.stringify(seen))}catch(e){}setHide(h=>({...h,[kind]:true}))};
  const i=apptInfo(a);const pill={flex:1,padding:'13px 10px',borderRadius:14,border:'none',fontSize:15,fontWeight:700,cursor:'pointer',fontFamily:'inherit'};
  return <div role="dialog" aria-modal="true" aria-label="Aviso de cita" style={{position:'fixed',inset:0,zIndex:1900,background:'rgba(0,0,0,.35)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
    <div className="anim" style={{background:'#fff',borderRadius:24,width:'100%',maxWidth:380,overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}>
      <div style={{background:'linear-gradient(135deg,#FF375F,#E0245E)',color:'#fff',padding:'20px 22px'}}><p style={{fontSize:13,fontWeight:700,opacity:.9,display:'flex',alignItems:'center',gap:6}}><Icon n="clock" size={15} color="#fff"/>{kind==='dia'?'MAÑANA TIENES CITA':'TU CITA ES DENTRO DE '+mins+' MIN'}</p><p className="sf" style={{fontSize:24,marginTop:6}}>{i.long}</p><p className="sf" style={{fontSize:40,lineHeight:1.1}}>{i.time} h</p></div>
      <div style={{padding:'16px 18px 18px'}}>
        {kind==='dia'?<><p style={{fontSize:15,color:TX,fontWeight:600,marginBottom:12}}>¿Confirmas tu asistencia?</p>
          <div style={{display:'flex',gap:8}}><button onClick={()=>{onStatus(a.id,'confirmada');close()}} className="press" style={{...pill,background:P,color:'#fff'}}>Confirmo</button><button onClick={async()=>{if(await nConfirm('La clínica recibirá el aviso y te contactará para buscar otra fecha.',{title:'¿No puedes ir?',ok:'Avisar',danger:true})){onStatus(a.id,'cancelada');close()}}} className="press" style={{...pill,background:'rgba(118,118,128,.12)',color:'#D70015'}}>No puedo ir</button></div>
          <button onClick={()=>setHide(h=>({...h,dia:true}))} style={{width:'100%',marginTop:10,border:'none',background:'none',color:TM,fontSize:14,cursor:'pointer',fontFamily:'inherit'}}>Recordármelo más tarde</button></>
        :<><p style={{fontSize:15,color:TX,marginBottom:4}}>Te esperamos{CLINIC.direccion?' en '+CLINIC.direccion:''}.</p><p style={{fontSize:13,color:TM,marginBottom:12}}>Si no puedes llegar, avisa cuanto antes por el chat.</p><button onClick={close} className="press" style={{...pill,width:'100%',background:P,color:'#fff'}}>Entendido</button></>}
      </div>
    </div>
  </div>;
}

// ═══ DETECCIÓN DE DISPOSITIVO ═══
// Móvil (vertical): cualquier teléfono, aunque gire la pantalla.
// PC (16:9): ordenador con ratón y pantalla ≥1024px, o tablet grande en horizontal (≥1180px).
function detectPC(){
  try{
    const ua=navigator.userAgent||'';
    if(/iPhone|iPod|Android.+Mobile|Windows Phone|BlackBerry|IEMobile|Opera Mini/i.test(ua))return false;
    const w=window.innerWidth||document.documentElement.clientWidth||0;
    const fine=!!(window.matchMedia&&window.matchMedia('(pointer:fine)').matches);
    if(w>=1024&&fine)return true;
    if(w>=1180)return true;
    return false;
  }catch(e){return false}
}

// ═══ MAIN APP ═══
function App() {
  const [loggedIn,setLoggedIn]=useState(false);
  const [isPC,setIsPC]=useState(detectPC);
  useEffect(()=>{const fn=()=>setIsPC(detectPC());window.addEventListener('resize',fn);window.addEventListener('orientationchange',fn);return()=>{window.removeEventListener('resize',fn);window.removeEventListener('orientationchange',fn)}},[]);
  useEffect(()=>{try{document.body.classList.toggle('is-pc',isPC)}catch(e){}},[isPC]);
  useEffect(()=>{if(!isPC&&['comidas','recetas','alimentos','medicacion','importar'].includes(page))setPage('diets')},[isPC]);

  const [role,setRole]=useState('');const [userName,setUserName]=useState('');const [patientId,setPatientId]=useState(null);
  const [page,setPage]=useState('panel');const [sub,setSub]=useState(null);
  const [patients,setPatients]=useState(IS_PROD?[]:DEMO_PATIENTS);
  const [appts,setAppts]=useState(()=>{if(IS_PROD)return [];try{return JSON.parse(localStorage.getItem('nusal_appts')||'[]')}catch(e){return []}});
  const [recipes,setRecipes]=useState(IS_PROD?[]:DEMO_RECIPES);
  const [diets,setDiets]=useState(IS_PROD?[]:DEMO_DIETS);
  const [mealBank,setMealBank]=useState(IS_PROD?[]:DEMO_MEAL_BANK);
  const [toast,setToast]=useState('');
  const [dbReady,setDbReady]=useState(false);
  const [consentOk,setConsentOk]=useState(true);

  // Carga los datos reales del servidor según el rol. Lo que devuelve el servidor manda, aunque esté vacío.
  async function loadServerData(r){
    if(!DB.ready) return;
    const ok=x=>Array.isArray(x);
    const [mb,rc,dt]=await Promise.all([DB.getMealBank(),DB.getRecipes(),DB.getWeeklyDiets()]);
    if(ok(mb))setMealBank(mb); if(ok(rc))setRecipes(rc); if(ok(dt))setDiets(dt);
    if(r==='admin'||r==='medico'){const [pt,ap]=await Promise.all([DB.getPatients(),DB.getAppointments()]);if(ok(pt))setPatients(pt);if(ok(ap))setAppts(ap)}
  }

  // Arranque: conectar con el servidor y restaurar la sesión
  useEffect(()=>{
    (async()=>{
      const ready = await DB.init();
      setDbReady(ready);
      if (ready && !IS_PROD) { setToast('✅ Conectado al servidor'); setTimeout(()=>setToast(''),2000); }
      // Auto-login
      try{
        if(DB.ready&&getToken()){
          // Sesión real: restaurar con el token (sin contraseñas guardadas)
          const me=await DB.me();
          if(me&&me.role){
            setRole(me.role);setUserName(me.fullName||'');
            loadServerData(me.role);
            if(me.role==='patient'){setPatientId(me.patientId);setPage('home');DB.getMyAppointments().then(a=>{if(a)setAppts(a.map(x=>({...x,patientId:me.patientId})))});setConsentOk(me.consentAccepted!==false);if(me.patientId){DB.getPatient(me.patientId).then(p=>{if(p)setPatients(prev=>prev.some(x=>x.id===p.id)?prev.map(x=>x.id===p.id?{...x,...p}:x):[...prev,p])})}}
            else setPage('panel');
            setLoggedIn(true);
          } else setToken('');
        } else if(!IS_PROD) {
          // Demo sin backend (nunca en producción): recordar solo el email (datos ficticios)
          const s=localStorage.getItem('nusal_auth');
          if(s){const d=JSON.parse(s);
            if(d.e===ADMIN_EMAIL){setRole('admin');setUserName(ADMIN_NAME);setLoggedIn(true);setPage('panel')}
            else if(d.e===MEDICO_EMAIL){setRole('medico');setUserName(MEDICO_NAME);setLoggedIn(true);setPage('panel')}
            else{const f=DEMO_PATIENTS.find(p=>p.email===d.e);if(f){setRole('patient');setUserName(f.nm);setPatientId(f.id);setLoggedIn(true);setPage('home');try{setConsentOk(localStorage.getItem('nusal_consent_'+f.id)==='1')}catch(e){}}}
          }
        }
      }catch(e){}
    })();
  },[]);

  // Cierre de sesión dentro de la app: vuelve al login vacío, listo para otro usuario.
  // Con servidor, además se vacían de memoria los datos de pacientes del usuario anterior.
  _appLogout=()=>{
    setLoggedIn(false);setSub(null);setPage('home');setUserName('');setPatientId(null);setConsentOk(true);
    if(DB.ready||IS_PROD){setPatients([]);setAppts([]);setRecipes([]);setDiets([]);setMealBank([])}
    try{window.scrollTo(0,0)}catch(e){}
  };
  function login(r,name,pid,extra){setRole(r);setUserName(name);setPatientId(pid);setLoggedIn(true);setPage(r==='patient'?'home':'panel');setSub(null);setDbReady(DB.ready);
    loadServerData(r);
    setConsentOk(r!=='patient' || (extra&&extra.consentAccepted!==false));
    // El paciente carga sus datos reales (peso, medidas, progreso)
    if(r==='patient'&&pid){DB.getMyAppointments().then(a=>{if(a)setAppts(a.map(x=>({...x,patientId:pid})))});DB.getPatient(pid).then(p=>{if(p){setPatients(prev=>prev.some(x=>x.id===pid)?prev.map(x=>x.id===pid?{...x,...p}:x):[...prev,p]);if(p.consentAccepted!==undefined)setConsentOk(p.consentAccepted)}})}
    // Personal clínico (admin o médico) refresca la lista de pacientes
  }
  function acceptConsent(){DB.acceptConsent();try{localStorage.setItem('nusal_consent_'+patientId,'1')}catch(e){}setConsentOk(true)}
  const patSyncT=useRef({});
  function upPat(id,data){setPatients(prev=>prev.map(p=>p.id===id?{...p,...data}:p));
    // Persistir en backend los campos de ficha (agrupando teclas con un pequeño retardo)
    const MAP={dni:'dni',phone:'phone',sex:'sex',birth:'birthDate',tg:'targetWeight',dietWeeks:'dietWeeks',paid:'paid',amount:'amountPaid',nextAppt:'nextAppt',active:'isActive',h:'heightCm',sw:'startWeight',medicacion:'medicacion',allergies:'allergies',dislikes:'dislikes',activityLevel:'activityLevel'};
    const payload={};Object.keys(data).forEach(k=>{if(MAP[k])payload[MAP[k]]=data[k]});
    if(Object.keys(payload).length&&DB.ready){
      patSyncT.current[id]={...(patSyncT.current[id]||{}),...payload};
      clearTimeout(patSyncT.current['t'+id]);
      patSyncT.current['t'+id]=setTimeout(()=>{const pl=patSyncT.current[id];patSyncT.current[id]={};DB.updatePatient(id,pl)},800);
    }
  }

  // Al asignar una dieta a un paciente: genera su cesta y las recetas de las comidas.
  async function assignDietToPatient(diet, patientId){
    // 1) Cesta de la compra (editable) a partir de la dieta
    const cesta = extractShoppingList(diet);
    upPat(patientId, {dietId: diet.id, shoppingList: cesta});
    // 2) Recetas automáticas de las comidas de la dieta (sin duplicar)
    const nuevasRecetas = recipesFromDiet(diet, recipes);
    if(nuevasRecetas.length){ setRecipes(prev=>[...prev, ...nuevasRecetas]); nuevasRecetas.forEach(r=>DB.addRecipe(r)); }
    // 3) Marcar la dieta como asignada y persistir
    setDiets(prev=>prev.map(d=>d.id===diet.id?{...d,assignedTo:[...(d.assignedTo||[]),patientId]}:d));
    await DB.assignDiet(patientId, diet.id);
  }
  // No leídos del chat → badge en la navegación del paciente
  useEffect(()=>{
    if(!loggedIn||role!=='patient'||!DB.ready||!patientId)return;
    let stop=false;
    const fn=async()=>{try{const r=await DB.getChat(patientId);if(r&&!stop){const n=r.filter(m=>m.senderRole!=='patient'&&!m.leido).length;setPatients(prev=>prev.map(p=>p.id===patientId?{...p,pq:n}:p))}}catch(e){}};
    fn();const t=setInterval(fn,30000);
    return()=>{stop=true;clearInterval(t)};
  },[loggedIn,role,patientId]);

  function importPatients(list){setPatients(prev=>[...prev,...list.filter(x=>x&&x.id&&!prev.some(y=>String(y.id)===String(x.id)))])}
  function addPat(p){setPatients(prev=>[...prev,p]);
    DB.createPatient({fullName:p.nm,email:p.email,password:p.pw,heightCm:p.h||null,startWeight:p.sw||p.w||null,currentWeight:p.w||null,targetWeight:p.tg||null,dni:p.dni||null,phone:p.phone||null,sex:p.sex||null,birthDate:p.birth||null,dietWeeks:p.dietWeeks||null,altaDate:p.alta||null}).then(r=>{
      if(r&&r.patient&&r.patient.id){setPatients(prev=>prev.map(x=>x.id===p.id?{...x,...r.patient,photo:x.photo}:x))}
      else if(DB.ready){setPatients(prev=>prev.filter(x=>x.id!==p.id));nAlert(((r&&r.error)||'No se pudo crear el paciente.')+' No se ha guardado: revisa los datos e inténtalo de nuevo.')}
    });
  }
  function setApptStatus(id,status){setAppts(prev=>{const n=prev.map(a=>String(a.id)===String(id)?{...a,status,respondedAt:new Date().toISOString()}:a);try{if(!DB.ready)localStorage.setItem('nusal_appts',JSON.stringify(n))}catch(e){}return n});if(DB.ready)DB.setApptStatus(id,status)}
  function addAppt(a){setAppts(prev=>{const n=[...prev,a];try{if(!DB.ready)localStorage.setItem('nusal_appts',JSON.stringify(n))}catch(e){}return n});
    DB.createAppointment({patientId:String(a.patientId),date:a.date,time:a.time,note:a.note||''}).then(r=>{if(r&&r.id)setAppts(prev=>prev.map(x=>x.id===a.id?{...x,id:r.id}:x));
      else if(DB.ready){setAppts(prev=>prev.filter(x=>x.id!==a.id));nAlert(((r&&r.error)||'No se pudo guardar la cita.')+' La cita no se ha creado: inténtalo de nuevo.')}});}
  function delAppt(id){setAppts(prev=>{const n=prev.filter(x=>x.id!==id);try{if(!DB.ready)localStorage.setItem('nusal_appts',JSON.stringify(n))}catch(e){}return n});DB.deleteAppointment(id);}
  function delPat(id){setPatients(prev=>prev.filter(p=>p.id!==id))}
  function nav(t){setPage(t);setSub(null)}

  if(!loggedIn)return <><Toast msg={toast}/><DialogHost/><LegalHost/><LoginScreen onLogin={login} patients={patients} pc={isPC}/></>;

  // Puerta de consentimiento: el paciente debe aceptar antes de usar la app
  if(role==='patient'&&!consentOk)return <><Toast msg={toast}/><DialogHost/><LegalHost/><ConsentGate name={userName} onAccept={acceptConsent}/></>;

  const curPat=patients.find(p=>p.id===patientId)||null;
  const isStaff=role==='admin'||role==='medico';
  let content=null;

  if(isStaff){
    if(sub!==null){const sp=patients.find(p=>p.id===sub);if(sp)content=<AdmPatFile patient={sp} onBack={()=>setSub(null)} onUp={upPat} diets={diets} onDelete={id=>{setPatients(prev=>prev.filter(p=>p.id!==id));setSub(null)}}/>}
    else if(page==='panel')content=<AdmPanel patients={patients} userName={userName} onSel={id=>setSub(id)} onAlerts={()=>nav('patients')} onQ={()=>nav('gestion')} appts={appts} onNav={nav}/>;
    else if(page==='patients')content=<AdmPatients patients={patients} onSel={id=>setSub(id)} onAdd={addPat}/>;
    else if(page==='citas')content=<AdmCitas patients={patients} appts={appts} onAdd={addAppt} onDel={delAppt} onSelPat={id=>setSub(id)} onUpPat={upPat}/>;
    else if(page==='diets')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only={isPC?'dietas':null}/>;
    else if(page==='dashboard')content=<PatientsDashboard patients={patients} appts={appts} diets={diets} onSel={id=>setSub(id)} addPat={addPat} onImported={importPatients}/>;
    else if(page==='importar')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only="importar"/>;
    else if(page==='comidas')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only="comidas"/>;
    else if(page==='recetas')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only="recetas"/>;
    else if(page==='alimentos')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only="alimentos"/>;
    else if(page==='medicacion')content=<AdmDietHub diets={diets} mealBank={mealBank} recipes={recipes} setDiets={setDiets} setMealBank={setMealBank} setRecipes={setRecipes} patients={patients} onUpdatePatient={upPat} onAssignDiet={assignDietToPatient} onNav={nav} only="medicacion"/>;
    else if(page==='gestion')content=<AdmGestion patients={patients} onAdd={addPat} onDel={delPat} onSel={id=>setSub(id)} role={role} mealBank={mealBank} diets={diets}/>;
  } else {
    if(page==='home')content=<PatHome patient={curPat} onNav={nav} diets={diets} onUpdate={upPat} appts={appts} onApptStatus={setApptStatus}/>;
    else if(page==='diet')content=<PatDiet patient={curPat} diets={diets} onUpdate={upPat}/>;
    else if(page==='shopping')content=<PatShopping patient={curPat} diets={diets} onUpdate={upPat}/>;
    else if(page==='progress')content=<PatProgress patient={curPat}/>;
    else if(page==='questions')content=<PatQuestions patient={curPat} onUpdate={upPat}/>;
    else if(page==='recipes')content=<PatRecipes recipes={recipes}/>;
    else if(page==='more')content=<PatMore patient={curPat} onUpdate={upPat}/>;
  }

  const admTabs=[{id:'panel',l:'Panel',ic:'home'},{id:'patients',l:'Pacientes',ic:'users'},{id:'citas',l:'Citas',ic:'clock'},{id:'diets',l:'Dieta',ic:'diet'},{id:'gestion',l:'Gestión',ic:'settings'}];
const admTabsPC=[{id:'panel',l:'Panel',ic:'home'},{id:'dashboard',l:'Dashboard',ic:'chart'},{id:'patients',l:'Pacientes',ic:'users'},{id:'citas',l:'Citas',ic:'clock'},{id:'diets',l:'Dietas',ic:'diet'},{id:'importar',l:'Importar dieta',ic:'download'},{id:'comidas',l:'Comidas',ic:'bowl'},{id:'recetas',l:'Recetas',ic:'recipe'},{id:'alimentos',l:'Alimentos',ic:'leaf'},{id:'medicacion',l:'Medicación',ic:'alert'},{id:'gestion',l:'Gestión',ic:'settings'}];
  const patTabs=[{id:'home',l:'Inicio',ic:'home'},{id:'diet',l:'Dieta',ic:'leaf'},{id:'shopping',l:'Compra',ic:'cart'},{id:'progress',l:'Evolución',ic:'chart'},{id:'more',l:'Más',ic:'menu'}];
  const NAVC={home:P,diet:'#16A34A',shopping:'#2563EB',progress:'#D97706',more:'#64748B',panel:P,patients:'#2563EB',citas:'#E11D48',dashboard:'#5856D6',diets:'#16A34A',importar:'#9333EA',comidas:'#0D9488',recetas:'#DB2777',alimentos:'#65A30D',medicacion:'#DC2626',gestion:'#D97706'};
  const NAVBG={home:'#E7D5F0',diet:'#D9F2E3',shopping:'#D6E4FB',progress:'#FAE5C0',more:'#E2E8F0',panel:'#E7D5F0',patients:'#D6E4FB',citas:'#FBD5DC',dashboard:'#E8E8FA',diets:'#D9F2E3',importar:'#F1E4FB',comidas:'#CCF0EC',recetas:'#FBD8EA',alimentos:'#E9F2D3',medicacion:'#FBE0E0',gestion:'#FAE5C0'};
  const tabs=role==='patient'?patTabs:(isPC?admTabsPC:admTabs);
  const activeTab=sub!==null?'patients':page;
  const unreadN=role==='patient'?((curPat&&curPat.pq)||0):patients.reduce((a,p)=>a+(p.pq||0),0);
  const openChat=()=>nav(role==='patient'?'questions':'panel');

  // ═══ MODO PC: menú lateral + contenido a lo ancho del monitor ═══
  if(isPC){
    const who=role==='patient'?((curPat&&curPat.nm)||userName||'Paciente'):(userName||'Equipo clínico');
    const ini=String(who).split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase();
    const roleLbl=role==='patient'?'Paciente':role==='admin'?'Administración':'Nutricionista';
    const secName=sub!==null?'Ficha del paciente':page==='questions'?'Mensajes':((tabs.find(t=>t.id===page)||{}).l||'');
    let today='';try{today=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}
    return (
      <div className="pc-shell" style={{display:'flex',minHeight:'100vh'}}>
        <Toast msg={toast}/><DialogHost/><LegalHost/>{loggedIn&&role==='patient'&&curPat&&consentOk&&<ApptReminder appts={appts} patient={curPat} onStatus={setApptStatus}/>}
        <aside className="noprint" style={{width:272,flex:'0 0 272px',position:'sticky',top:0,height:'100vh',background:'#fff',display:'flex',flexDirection:'column',padding:'26px 16px 18px',borderRight:'0.5px solid rgba(60,60,67,.18)',zIndex:60}}>
          <div style={{display:'flex',alignItems:'center',gap:12,padding:'0 8px 22px',borderBottom:'1px solid '+BD}}>
            <img src={BRAND.logo||LOGO} alt={APP_NAME} style={{width:48,height:48,borderRadius:'50%',objectFit:'cover',boxShadow:'0 4px 12px rgba(123,45,142,.28)'}}/>
            <div style={{minWidth:0}}><p style={{fontFamily:"var(--round)",fontWeight:800,fontSize:24,color:P,lineHeight:1.05,letterSpacing:.4}}>{APP_NAME}</p><p style={{fontSize:11.5,color:TM,fontWeight:600}}>{role==='patient'?'Tu espacio de salud':'Panel clínico'}</p></div>
          </div>
          <nav className="noscroll" style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:4,padding:'18px 0'}}>
            {tabs.map(tab=>{const isA=activeTab===tab.id;const c=NAVC[tab.id]||P;return <button key={tab.id} onClick={()=>nav(tab.id)} className={"press"+(isA?"":" pc-navbtn")} style={{display:'flex',alignItems:'center',gap:13,width:'100%',padding:'7px 10px',border:'none',borderRadius:10,background:isA?'rgba(118,118,128,.16)':'transparent',cursor:'pointer',fontFamily:'inherit',textAlign:'left',position:'relative'}}>
              
              <span style={{width:30,height:30,flex:'0 0 30px',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',background:tab.id==='home'&&role==='patient'?'transparent':c}}>{tab.id==='home'&&role==='patient'?<img src={BRAND.logo||LOGO} alt={APP_NAME} style={{width:32,height:32,borderRadius:'50%',objectFit:'cover',background:'#fff'}}/>:<Icon n={tab.ic} size={17} color="#fff" sw={2.1}/>}</span>
              <span style={{fontSize:15,fontWeight:isA?600:500,color:TX}}>{tab.l}</span>
            </button>})}
          </nav>
          <div style={{borderTop:'1px solid '+BD,paddingTop:16}}>
            <div style={{display:'flex',alignItems:'center',gap:11,padding:'0 6px 14px'}}>
              <div style={{width:40,height:40,flex:'0 0 40px',borderRadius:'50%',background:'linear-gradient(135deg,'+P+',#A64BB8)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:800,fontSize:14}}>{ini||'·'}</div>
              <div style={{minWidth:0}}><p style={{fontSize:13.5,fontWeight:700,color:TX,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{who}</p><p style={{fontSize:11.5,color:TM}}>{roleLbl}</p></div>
            </div>
            <button onClick={doLogout} className="press pc-navbtn" style={{width:'100%',display:'flex',alignItems:'center',gap:10,padding:'10px 12px',border:'1px solid '+BD,borderRadius:14,background:'#fff',color:TS,fontSize:13.5,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Cerrar sesión
            </button>
          </div>
        </aside>
        <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>
          <header className="noprint" style={{position:'sticky',top:0,zIndex:50,background:'rgba(238,232,243,.86)',backdropFilter:'blur(14px)',WebkitBackdropFilter:'blur(14px)',borderBottom:'1px solid rgba(123,45,142,.09)',padding:'14px 44px',display:'flex',alignItems:'center',gap:18}}>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:11,fontWeight:700,letterSpacing:1.3,textTransform:'uppercase',color:TM}}>{today}</p>
              <p style={{fontSize:15,color:TS,marginTop:1}}><span style={{color:TM}}>{APP_NAME}</span><span style={{color:TM,margin:'0 8px'}}>›</span><b style={{color:TX}}>{secName}</b></p>
            </div>
            <button onClick={openChat} className="press" style={{position:'relative',display:'flex',alignItems:'center',gap:9,padding:'10px 18px',borderRadius:50,border:'none',background:'#FBD5DC',color:RS,fontWeight:800,fontSize:13.5,cursor:'pointer',fontFamily:'inherit'}}>
              <Icon n="chat" size={17} color={RS}/>Mensajes
              {unreadN>0&&<span style={{background:RS,color:'#fff',fontSize:11,fontWeight:800,borderRadius:50,minWidth:22,height:22,display:'inline-flex',alignItems:'center',justifyContent:'center',padding:'0 6px'}}>{unreadN}</span>}
            </button>
          </header>
          <div className="pc-content" style={{padding:'30px 44px 60px',width:'100%',maxWidth:1640,margin:'0 auto'}}>{content}</div>
        </main>
      </div>
    );
  }

  return (
    <div className="app-shell" style={{maxWidth:480,margin:'0 auto',minHeight:'100vh',background:BG,position:'relative'}}>
      <Toast msg={toast}/><DialogHost/><LegalHost/>{loggedIn&&role==='patient'&&curPat&&consentOk&&<ApptReminder appts={appts} patient={curPat} onStatus={setApptStatus}/>}
      <BrandBar onChat={openChat} unread={unreadN}/>
      <div style={{padding:'16px 16px 88px'}}>{content}</div>
      <nav className="noprint app-nav" style={{position:'fixed',bottom:0,left:0,right:0,zIndex:100,maxWidth:480,margin:'0 auto',background:'rgba(249,249,249,.86)',backdropFilter:'saturate(180%) blur(20px)',WebkitBackdropFilter:'saturate(180%) blur(20px)',borderTop:'0.5px solid rgba(60,60,67,.25)',display:'flex',justifyContent:'space-around',alignItems:'flex-start',paddingTop:6,paddingBottom:'calc(6px + env(safe-area-inset-bottom))',minHeight:56}}>
        {tabs.map(tab=>{const isA=activeTab===tab.id;const c=isA?(NAVC[tab.id]||P):'#8E8E93';return <button key={tab.id} onClick={()=>nav(tab.id)} className="press" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,background:'none',border:'none',padding:2,flex:1,minWidth:0,cursor:'pointer'}}>{tab.id==='home'&&role==='patient'?<img src={BRAND.logo||LOGO} alt={APP_NAME} style={{width:27,height:27,borderRadius:'50%',objectFit:'cover',background:'#fff',boxShadow:isA?'0 0 0 2px '+c:'0 0 0 1px rgba(0,0,0,.1)'}}/>:<Icon n={tab.ic} size={25} color={c} sw={isA?2.1:1.7}/>}<span style={{fontSize:10.5,fontWeight:isA?600:500,color:c}}>{tab.l}</span></button>})}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
